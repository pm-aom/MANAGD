<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANAGD — The Ticket System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* MANAGD brand: blue #276EF1, navy #0F1C4D */
  --navy:#0F1C4D; --blue:#276EF1;
  --paper:#F4F6FC; --card:#FFFFFF; --ink:#0F1C4D; --ink-soft:#586489;
  --rule:#DBE2F2; --teal:#276EF1; --teal-dim:#E6EDFE; --brass:#1B55C0; --brass-dim:#E6EDFE;
  --bad:#A63A24; --bad-dim:#F7E6E1; --ok-dim:#D5E2FD; --shadow:0 1px 0 rgba(15,28,77,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
--blue:#5C93F8; --paper:#0A1230; --card:#131C42; --ink:#E9EEFA; --ink-soft:#9DA9CE;
    --rule:#26315C; --teal:#5C93F8; --teal-dim:#1B2B58; --brass:#7FA9FB; --brass-dim:#18244C;
    --bad:#E08268; --bad-dim:#3A1E18; --ok-dim:#20346E; --shadow:none;
  }
}
:root[data-theme="dark"]{
--blue:#5C93F8; --paper:#0A1230; --card:#131C42; --ink:#E9EEFA; --ink-soft:#9DA9CE;
  --rule:#26315C; --teal:#5C93F8; --teal-dim:#1B2B58; --brass:#7FA9FB; --brass-dim:#18244C;
  --bad:#E08268; --bad-dim:#3A1E18; --ok-dim:#20346E; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:16.5px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.ui{font-family:"Poppins","Helvetica Neue",Arial,sans-serif;font-weight:600;letter-spacing:-.02em}
a{color:var(--teal)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--rule);background:var(--card);padding:26px 22px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:40px 6vw 96px;max-width:940px}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:18px 20px 22px}
  .main{padding:26px 20px 80px}
  body{font-size:16.5px}
}
.logo{display:block;width:158px;height:auto;margin:0 0 14px}
.logo.on-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.on-light{display:none} :root:not([data-theme="light"]) .logo.on-dark{display:block}}
:root[data-theme="dark"] .logo.on-light{display:none}
:root[data-theme="dark"] .logo.on-dark{display:block}
.brand{font-size:17px;line-height:1.25;margin:0}
.brand small{display:block;font-family:"Inter",sans-serif;font-weight:400;font-size:13px;color:var(--ink-soft);letter-spacing:0;margin-top:5px}
.who{margin:16px 0 0;font-size:13px;color:var(--ink-soft);font-family:"Poppins",sans-serif}
.who b{color:var(--ink)}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0 18px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.ring{width:42px;height:42px;flex:none}
.prog-t{font-size:13.5px;line-height:1.35;color:var(--ink-soft);font-family:"Poppins",sans-serif;font-weight:500}
.prog-t b{display:block;color:var(--ink);font-size:15px}
nav ol{list-style:none;margin:0;padding:0}
nav button{width:100%;text-align:left;background:none;border:0;padding:9px 10px 9px 34px;color:var(--ink);font-size:14.5px;line-height:1.35;cursor:pointer;border-radius:8px;position:relative;font-family:"Poppins",sans-serif;font-weight:500}
nav button:hover{background:var(--paper)}
nav button[aria-current="true"]{background:var(--teal-dim)}
nav .mk{position:absolute;left:8px;top:10px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center}
nav .done .mk{background:var(--teal);border-color:var(--teal)}
nav button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--blue)}
nav .done .mk::after{content:"✓";font-size:11px;line-height:1;color:#fff}
.side-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);display:flex;gap:12px;flex-wrap:wrap}
.tiny{font-size:12.5px;color:var(--ink-soft);font-family:"Poppins",sans-serif}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:"Poppins",sans-serif}
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:34px;position:relative}
.hero::before{content:"";display:block;width:54px;height:4px;border-radius:2px;background:var(--blue);margin:0 0 18px}
.hero h1{font-size:clamp(32px,5.6vw,52px);line-height:1.03;margin:0 0 16px;max-width:16ch}
.hero p{font-size:18px;max-width:60ch;color:var(--ink-soft);margin:0 0 22px}
.hero .meta{display:flex;gap:26px;flex-wrap:wrap;font-family:"Poppins",sans-serif;font-size:13.5px;color:var(--ink-soft)}
.hero .meta b{display:block;color:var(--ink);font-size:24px;font-weight:700;line-height:1.1}
.eyebrow{font-family:"Poppins",sans-serif;font-size:13px;color:var(--teal);font-weight:600;margin:0 0 8px}
h2.mtitle{font-size:clamp(26px,4.2vw,37px);line-height:1.1;margin:0 0 10px;max-width:21ch}
.lede{font-size:17.5px;color:var(--ink-soft);margin:0 0 30px;max-width:62ch}
.main p,.main li{max-width:70ch}
h3{font-size:21px;margin:34px 0 10px}
.main ul{padding-left:20px}
.main li{margin:6px 0}
.callout{border-left:3px solid var(--blue);background:var(--brass-dim);padding:14px 18px;border-radius:0 8px 8px 0;margin:22px 0;font-size:16.5px;max-width:70ch}
.callout b{font-family:"Poppins",sans-serif}
.tablewrap{overflow-x:auto;margin:20px 0;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:"Poppins",sans-serif;font-size:13.5px;color:var(--ink-soft);font-weight:600;background:var(--paper)}
tr:last-child td{border-bottom:0}
td.yes{color:var(--teal);font-weight:600}
td.no{color:var(--ink-soft)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.flow div{flex:1 1 130px;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:12px 14px;font-family:"Poppins",sans-serif;font-size:14px;line-height:1.3}
.flow span{display:block;color:var(--teal);font-size:12px;margin-bottom:5px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:22px 0}
.flip{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;cursor:pointer;text-align:left;min-height:106px;box-shadow:var(--shadow);display:flex;align-items:center;font-size:15px;line-height:1.4;color:var(--ink)}
.flip:hover{border-color:var(--teal)}
.flip .b{color:var(--teal);font-weight:600;font-family:"Poppins",sans-serif}
.ex{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 20px 16px;margin:26px 0;box-shadow:var(--shadow)}
.ex .kind{font-family:"Poppins",sans-serif;font-size:12.5px;color:var(--brass);font-weight:600;margin-bottom:8px}
.ex .q{font-size:17.5px;margin:0 0 14px;font-weight:600;font-family:"Poppins",sans-serif;line-height:1.35}
.msg{background:var(--paper);border-radius:10px;padding:13px 15px;margin:0 0 16px;border:1px solid var(--rule)}
.msg b{display:block;font-style:normal;font-family:"Poppins",sans-serif;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:11px 14px;cursor:pointer;font-size:15.8px;line-height:1.45;color:var(--ink);font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--blue);background:var(--ok-dim);box-shadow:inset 0 0 0 1px var(--blue);font-weight:600;padding-left:40px;position:relative}
.opt.right::before{content:"✓";position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;line-height:19px;text-align:center;font-family:"Poppins",sans-serif;font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-dim);box-shadow:inset 0 0 0 1px var(--bad);padding-left:40px;position:relative}
.opt.wrong::before{content:"✕";position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;line-height:19px;text-align:center;font-family:"Poppins",sans-serif;font-weight:700}
.opt.picked{border-color:var(--teal);background:var(--teal-dim);box-shadow:inset 0 0 0 1px var(--teal)}
.why{margin-top:13px;font-size:15.5px;padding:12px 14px;border-radius:9px;line-height:1.5}
.why.ok{background:var(--ok-dim);border-left:3px solid var(--blue)} .why.no{background:var(--bad-dim);border-left:3px solid var(--bad)}
.why b{font-family:"Poppins",sans-serif}
.btn{background:var(--teal);color:#fff;border:0;padding:12px 22px;border-radius:9px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:"Poppins",sans-serif}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule)}
.gate{font-size:14px;color:var(--ink-soft);font-family:"Poppins",sans-serif}
.score{font-size:60px;line-height:1;font-family:"Poppins",sans-serif;font-weight:700}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:14px 0 6px;max-width:420px}
.bar i{display:block;height:100%;background:var(--blue)}
.cert{border:2px solid var(--blue);border-radius:14px;padding:28px;margin:26px 0;background:var(--card);max-width:620px}
.cert h3{margin:0 0 6px;font-size:24px}
input[type=text],input[type=email],textarea{font-family:inherit;font-size:16px;padding:10px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);width:min(340px,100%)}
textarea{width:100%;min-height:150px;font-size:13.5px;line-height:1.5}
.gate-screen{max-width:520px;margin:8vh auto;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:32px}
.field{margin:16px 0}
.field label{display:block;font-family:"Poppins",sans-serif;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.hidden{display:none}
.status{font-size:14px;font-family:"Poppins",sans-serif;color:var(--ink-soft);margin-top:10px}
@media print{.side{display:none}.shell{display:block}.navrow,.btn{display:none}}
</style>
</head>
<body>

  reportUrl:    the Google Apps Script "exec" URL from the setup guide below.
                Every passed/attempted exam POSTs a row to your Google Sheet.
                Leave "" to disable automatic sending.

  managerEmail: used for the "Email it" fallback button on the result screen.
======================================== -->
<script>
const CONFIG = {
  reportUrl: "https://script.google.com/macros/s/AKfycbyyB-XmptQGYuZd6qKraB-HFRq6AjitXYnWI5GEkW4xuGAfO54d36VI1dL8bg4XTKvE/exec",
  sheetUrl: "",
  managerEmail: ""
};
</script>

<div id="app"></div>

<script>
/* ======================= CONTENT ======================= */
const MODULES = [
 {id:"start", nav:"Start here", num:"", title:"The ticket system in 7 short chapters",
  lede:"This course is about the ticket system for investor requests. You have seen it live. This part helps you remember it.",
  blocks:[
   {t:"p",v:"Investors send questions from their portal. You answer them in the Employee Portal. The tricky part is that they see less than you do. They have different names for things, a different number, and fewer statuses."},
   {t:"callout",v:"<b>One word before you start.</b> In the portal the role is called <b>Property Manager</b>. At Managd this is the <b>responsible Tenant Coordinator (TC)</b> of the unit. Same person, different label. This course uses “responsible TC” and shows the portal label where you need it."},
   {t:"list",v:[
     "This system is for <b>investor</b> requests.",
     "7 chapters, about 3 minutes each.",
     "2 questions after every chapter.",
     "Final exam: 9 questions. You need 75% to pass. You can retake it.",
     "Your progress is saved on this device.",
     "When you pass, send your result to your manager with the button at the end."
   ]},
   {t:"callout",v:"<b>Remember this one line:</b> the investor only sees what you send them. And the system never chases a ticket for you."}
  ]},

 {id:"m1", nav:"1 · Two portals", num:"Chapter 1", title:"Two portals, one ticket",
  lede:"The same item has two names and two numbers. It depends on who is looking at it.",
  blocks:[
   {t:"p",v:"Investors write to us under <b>Support</b>, in the portal and in the app. On their side it is called a <b>request</b>. You open the same item under <b>Tickets</b> in the Employee Portal."},
   {t:"p",v:"Every ticket belongs to one investor. If the investor owns a unit, it also belongs to one unit. It also has a department, a category, a status, a priority and usually an assignee."},
   {t:"table",v:{head:["You say","The investor sees"],rows:[
     ["Ticket #46","Request ANF-0046"],
     ["Department and Category","Area and Topic"],
     ["Message to investor","Reply from the team"],
     ["Internal note","nothing"],
     ["4 statuses","3 statuses"]
   ]}},
   {t:"callout",v:"<b>Ticket #46 is request ANF-0046.</b> It is the same number with zeros in front. If an investor writes ANF-0046, search for 46."},
   {t:"h",v:"What the investor can see"},
   {t:"table",v:{head:["They see this","They do not see this"],rows:[
     ["Their own messages and files","Internal notes and the files in them"],
     ["Your messages to them, with files","Files you attached when you created a ticket"],
     ["The subject and description you wrote","Priority, assignee, pulled-in colleagues"],
     ["The status, in 3 stages","The status Waiting on investor"],
     ["Status changes, as a line in their thread","Who changed anything, and when"]
   ]}},
   {t:"p",v:"Their request is a conversation. Their own messages are on one side, yours on the other, and between them the thread shows lines like <b>Status: Resolved</b>. So a status change is visible to them — but with no name and no reason. Only your message can explain it."},
   {t:"list",v:[
     "They can reply, add files, press <b>Mark as resolved</b> and press <b>Reopen</b>.",
     "They see your first name only, like “Tobias · Managd”. No surname, no email address."
   ]},
   {t:"p",v:"In their list a request is titled by unit and building — <b>104 · The Ivy</b> — with department, topic, date and the first line of their own message underneath. So they recognise a request by the unit, not by a subject."},
   {t:"quiz",v:{q:"An investor asks about request ANF-0203. Which ticket do you open?",
     o:["Ticket #203 in the Employee Portal","Ticket #2030, with the zero kept","Ticket ANF-203, with the prefix","There is no ticket behind that number"],
     c:0,w:"The investor number is the ticket number with zeros in front."}},
   {t:"scenario",v:{from:"Investor, on the phone",msg:"I can see something changed on my request yesterday, but nobody explained it. What happened?",
     o:["Explain it in a message to the investor","Tell them to open the history in their portal","Tell them the change is internal","Send them a screenshot of the history"],
     c:0,w:"Their thread shows that the status changed, but not who changed it or why. Only a message to the investor can explain it."}}
  ]},

 {id:"m2", nav:"2 · Who sees a ticket", num:"Chapter 2", title:"Who sees a ticket, and who owns it",
  lede:"Your role decides which tickets you see. The category decides which team owns the ticket.",
  blocks:[
   {t:"table",v:{head:["Role","Sees"],rows:[
     ["Administrator","all four departments"],
     ["Property Manager (this is the responsible TC)","Property Management"],
     ["Finance Manager","Finance"],
     ["Sales Agent","nothing — they have no Tickets menu"]
   ]}},
   {t:"list",v:[
     "You always see a ticket you are <b>assigned to</b>. You always see a ticket you were <b>pulled into</b>. Your department does not matter here.",
     "Legal &amp; Handover and App / Portal have no role yet. Only administrators see them, so those tickets will not appear in your lists.",
     "If you can see a ticket, you can change everything on it. There is no read-only role.",
     "Only administrators can delete a ticket. A deleted ticket is gone, with its files.",
     "Cannot open a ticket? You get one message for two different cases: it does not exist, or you have no access. So the message is not proof that it was deleted."
   ]},
   {t:"h",v:"The category picks the department"},
   {t:"p",v:"You never choose a department. You choose a category, and the department follows. So every ticket lands in the right department by itself."},
   {t:"p",v:"The <b>assignee</b> is a different story. In Property Management the ticket also goes straight to the responsible TC of that unit. In Finance, Legal &amp; Handover and App / Portal it arrives with no assignee, and the department decides who answers."},
   {t:"table",v:{head:["Department","Categories"],rows:[
     ["Finance","Payout, Invoice, Service charge, Bank details, Statement, AFA Report"],
     ["Property Management","Leasing, Tenant, Lease renewal, Maintenance, Key Handover, Viewing Request"],
     ["Legal &amp; Handover","Handover, Power of attorney, Title Deed / OQOOD, Resale, DEWA, Empower, Legal Case, PM Contract"],
     ["App / Portal","Bug, Feedback, Credentials, Data Entry, Connection Request"]
   ]}},
   {t:"p",v:"Every list also has an “Other” option. The investor chooses from the same lists. For them they are called Area and Topic."},
   {t:"p",v:"Your own work sits in Property Management: Tenant, Lease renewal, Maintenance, Key Handover, Viewing Request. Good to know: <b>DEWA</b>, <b>Empower</b> and <b>Power of attorney</b> are not in that list. They belong to Legal &amp; Handover, so those tickets go to another team."},
   {t:"callout",v:"<b>One request, one ticket.</b> A ticket has one category. If the investor asks about a second topic in the same ticket, ask them to send that question through <b>Support</b>. It then starts its own ticket, in the right department."},
   {t:"callout",v:"<b>Careful when you change the category.</b> The ticket moves to the other department. If the assignee does not work there, the assignee is removed. And you may lose access to the ticket yourself."},
   {t:"quiz",v:{q:"A TC is pulled into a Finance ticket. What can they do there?",
     o:["Everything, except delete it","Only read it and write internal notes","Only reply to the investor","Nothing, until they get Finance rights"],
     c:0,w:"Seeing a ticket and editing it are the same thing here. Only deleting is for administrators."}},
   {t:"scenario",v:{from:"Investor, writing in ticket #52 (category: Tenant)",msg:"Thank you for the update on the new tenant. One more thing: my payout for August is still missing. Can you check that too?",
     o:["Answer about the tenant here, and ask them to send the payout question through Support","Change the category of this ticket to Payout, so Finance takes it over","Answer the payout question here yourself, to save them a second wait","Change the category to Payout and pull in a finance colleague as well"],
     c:0,w:"A ticket has only one category. If you change it to Payout, this whole ticket moves to Finance, the assignee can be removed, and you can lose access to it yourself. A request the investor sends through Support starts its own ticket in Finance, with a Cliq message and a confirmation email to the investor."}}
  ]},

 {id:"m3", nav:"3 · How it starts", num:"Chapter 3", title:"Two ways a ticket starts",
  lede:"Who creates the ticket decides what happens automatically. Above all: who gets an email.",
  blocks:[
   {t:"h",v:"The investor creates it"},
   {t:"list",v:[
     "They write the message and pick the unit, the Area and the Topic. They can attach images and PDFs.",
     "The investor never types a subject. The system builds it from unit and topic: “104 · The Ivy · Payout”. The investor only writes the message inside.",
     "The ticket starts as <b>Open</b> with priority <b>Medium</b>.",
     "Property Management tickets go straight to the <b>responsible TC of that unit</b> (the portal calls this the property manager). That person gets an email.",
     "Tickets for the other departments arrive without an assignee. The department itself decides who answers.",
     "The team gets a message in the <b>Zoho Cliq</b> channel.",
     "The investor gets an email. It promises an answer <b>within 48 hours on business days</b> (Mon to Fri, 9:00 to 18:00 GST)."
   ]},
   {t:"callout",v:"<b>You can always tell where a ticket came from.</b> The header of the ticket says it: <i>Created by the investor in the portal on Sep 23, 2026</i>. Tickets created by an employee say so too."},
   {t:"h",v:"You create it"},
   {t:"list",v:[
     "You fill in investor, unit, priority, category, subject and description. The assignee is optional.",
     "If you leave the assignee empty on a Property Management ticket, the responsible TC of the unit gets it.",
     "The investor sees your subject and description. <b>Files you attach here stay internal.</b>",
     "The investor gets no email. There is no Cliq message. The assignee gets an email, but not if you assigned the ticket to yourself."
   ]},
   {t:"callout",v:"<b>A ticket you create is silent for the investor.</b> Nothing reaches them until you send a message to the investor."},
   {t:"quiz",v:{q:"An investor sends a question about a lease renewal. The unit has a responsible TC. What happens by itself?",
     o:["Open, Medium, assigned to that TC, and a Cliq message","Open, Medium, but somebody has to assign it by hand","In progress, as soon as the TC opens the ticket","Open, and the investor is told who will handle it"],
     c:0,w:"Lease renewal is a Property Management category, so the ticket goes to the responsible TC of that unit. The investor never sees who is assigned."}},
   {t:"quiz",v:{q:"A new investor request arrives and nobody is assigned to it. How does the team hear about it?",
     o:["A message in the Zoho Cliq channel","An email to everyone in the department","A blue dot on the Tickets menu","A daily summary of new requests"],
     c:0,w:"Cliq is the only signal for a ticket with no assignee — it shows a blue dot to nobody. So watch the channel and the filter Open + Unassigned."}}
  ]},

 {id:"m4", nav:"4 · Statuses", num:"Chapter 4", title:"4 statuses for you, 3 for them",
  lede:"Your reply never changes the status. The investor's reply does.",
  blocks:[
   {t:"table",v:{head:["Your status","Use it when","They see"],rows:[
     ["Open","nobody picked it up yet","Received, or In progress after your first message"],
     ["In progress","you are working on it","In progress"],
     ["Waiting on investor","you need an answer from them","In progress"],
     ["Resolved","it is done","Resolved"]
   ]}},

 {id:"m5", nav:"5 · Notes and messages", num:"Chapter 5", title:"Internal note or message to the investor",
  lede:"Two tabs in the same box. One is for colleagues. One is for the client.",

     ["Files","stay internal","the investor sees them"]

 {id:"m6", nav:"6 · What it will not do", num:"Chapter 6", title:"What the system does not do",

  blocks:[

/* ======================= BLOCKS ======================= */
function renderBlocks(blocks,pageId){
  const out=document.createElement("div");
  gradeable[pageId]={total:0,answered:0,correct:0};
  blocks.forEach(b=>{
    if(b.t==="p") out.appendChild(el(`<p>${b.v}</p>`));
    else if(b.t==="h") out.appendChild(el(`<h3>${b.v}</h3>`));
    else if(b.t==="list") out.appendChild(el(`<ul>${b.v.map(i=>`<li>${i}</li>`).join("")}</ul>`));
    else if(b.t==="callout") out.appendChild(el(`<div class="callout">${b.v}</div>`));
    else if(b.t==="table") out.appendChild(el(`<div class="tablewrap"><table><thead><tr>${b.v.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.v.rows.map(r=>`<tr>${r.map(c=>`<td${c==="✓"?' class="yes"':(c==="—"?' class="no"':"")}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`));
    else if(b.t==="flow") out.appendChild(el(`<div class="flow">${b.v.map(s=>`<div><span>Step ${s[0]}</span>${s[1]}</div>`).join("")}</div>`));
    else if(b.t==="cards"){
      const wrap=el(`<div class="cards"></div>`);
      b.v.forEach(c=>{
        const btn=el(`<button class="flip" type="button"></button>`);
        let f=false; const paint=()=>{btn.innerHTML=f?`<span class="b">${c.b}</span>`:`<span>${c.f}</span>`;};
        paint(); btn.addEventListener("click",()=>{f=!f;paint();});
        wrap.appendChild(btn);
      });
      out.appendChild(wrap);
    }
    else if(b.t==="quiz"||b.t==="scenario"){ gradeable[pageId].total++; out.appendChild(buildQuestion(b,pageId)); }
  });
  return out;
}

function buildQuestion(b,pageId){
  const isScen=b.t==="scenario", d=b.v;
  const box=el(`<div class="ex">
    <div class="kind">${isScen?"Scenario — choose your reply":"Check yourself"}</div>
    ${isScen?`<div class="msg"><b>${d.from}</b>${d.msg}</div><p class="q">How do you respond?</p>`:`<p class="q">${d.q}</p>`}
    <div class="opts"></div><div class="why hidden"></div></div>`);
  const opts=box.querySelector(".opts"), why=box.querySelector(".why");
  shuffled(d.o.length).forEach(i=>{
    const text=d.o[i];
    const btn=el(`<button class="opt" type="button"></button>`); btn.textContent=text; btn.dataset.i=i;
    btn.addEventListener("click",()=>{
      if(box.dataset.answered) return;
      box.dataset.answered="1";
      [...opts.children].forEach(o=>{o.disabled=true; if(+o.dataset.i===d.c)o.classList.add("right");});
      const ok=i===d.c; if(!ok) btn.classList.add("wrong");
      why.className="why "+(ok?"ok":"no");
      why.innerHTML=`<b>${ok?"Correct.":"Not this one."}</b> ${d.w}`;
      gradeable[pageId].answered++; if(ok) gradeable[pageId].correct++;
      updateGate(pageId);
    });
    opts.appendChild(btn);
  });
  return box;
}

function updateGate(pageId){
  const g=gradeable[pageId]; if(!g) return;
  const btn=document.getElementById("completeBtn"), note=document.getElementById("gateNote");
  if(!btn) return;
  const left=g.total-g.answered;
  btn.disabled=left>0;
  if(note) note.textContent = left>0 ? `${left} question${left>1?"s":""} left in this chapter`
    : (g.total?`${g.correct} of ${g.total} right first time`:"");
}

/* ======================= PAGES ======================= */
function renderModule(m){
  const main=document.getElementById("main"); main.innerHTML="";
  if(m.id==="start"){
    main.appendChild(el(`<header class="hero">
      <h1>${m.title}</h1><p>${m.lede}</p>
      <div class="meta"><div><b>${MODULES.length-1}</b>chapters</div><div><b>${EXAM.length}</b>exam questions</div><div><b>75%</b>to pass</div></div></header>`));
  }else{
    main.appendChild(el(`<p class="eyebrow">${m.num}</p>`));
    main.appendChild(el(`<h2 class="mtitle">${m.title}</h2>`));
    main.appendChild(el(`<p class="lede">${m.lede}</p>`));
  }
  main.appendChild(renderBlocks(m.blocks,m.id));
  const isDone=state.done.includes(m.id);
  const row=el(`<div class="navrow"><button class="btn" id="completeBtn">${isDone?"Completed — continue":"Mark complete and continue"}</button><span class="gate" id="gateNote"></span></div>`);
  main.appendChild(row);
  row.querySelector("#completeBtn").addEventListener("click",()=>{
    const g=gradeable[m.id];
    if(g&&g.total) state.scores[m.id]={c:g.correct,t:g.total};
    if(!state.done.includes(m.id)) state.done.push(m.id);
    save(); buildNav(); updateProgress();
    const i=PAGES.indexOf(m.id); go(PAGES[Math.min(i+1,PAGES.length-1)]);
  });
  updateGate(m.id);
  main.focus(); window.scrollTo(0,0);
}

let examAnswers=[];
function renderExam(){
  const main=document.getElementById("main"); main.innerHTML="";
  main.appendChild(el(`<p class="eyebrow">Final exam</p>`));
  main.appendChild(el(`<h2 class="mtitle">${EXAM.length} questions, 75% to pass</h2>`));
  const left=MODULES.length-state.done.length;
  main.appendChild(el(`<p class="lede">${left>0?`You still have ${left} chapter${left>1?"s":""} to complete — you can take the exam anyway, but it will be harder than it needs to be.`:"All modules complete. Answer everything, then submit."}${state.best?` Your best score so far: ${state.best}%.`:""}</p>`));
  examAnswers=new Array(EXAM.length).fill(null);
  const form=document.createElement("div");
  EXAM.forEach((q,qi)=>{
    const box=el(`<div class="ex"><div class="kind">Question ${qi+1} of ${EXAM.length}</div><p class="q">${q.q}</p><div class="opts"></div><div class="why hidden"></div></div>`);
    const opts=box.querySelector(".opts");
    shuffled(q.o.length).forEach(i=>{
      const text=q.o[i];
      const btn=el(`<button class="opt" type="button"></button>`); btn.textContent=text; btn.dataset.i=i;
      btn.addEventListener("click",()=>{
        if(box.dataset.locked) return;
        examAnswers[qi]=i;
        [...opts.children].forEach(o=>o.classList.remove("picked"));
        btn.classList.add("picked");
        const sb=document.getElementById("submitExam"); if(sb) sb.disabled=examAnswers.includes(null);
      });
      opts.appendChild(btn);
    });
    form.appendChild(box);
  });
  main.appendChild(form);
  const row=el(`<div class="navrow"><button class="btn" id="submitExam" disabled>Submit exam</button><span class="gate">Answer all ${EXAM.length} questions to submit</span></div>`);
  main.appendChild(row);
  const result=el(`<div id="examResult"></div>`); main.appendChild(result);

  row.querySelector("#submitExam").addEventListener("click",()=>{
    let correct=0;
    [...form.children].forEach((box,qi)=>{
      box.dataset.locked="1";
      const q=EXAM[qi], opts=box.querySelectorAll(".opt"), why=box.querySelector(".why");
      opts.forEach(o=>{o.disabled=true;o.classList.remove("picked");
        if(+o.dataset.i===q.c)o.classList.add("right"); else if(+o.dataset.i===examAnswers[qi])o.classList.add("wrong");});
      const ok=examAnswers[qi]===q.c; if(ok)correct++;
      why.className="why "+(ok?"ok":"no");
      why.innerHTML=`<b>${ok?"Correct.":"Not this one."}</b> ${q.w}`;
    });
    const pct=Math.round(correct/EXAM.length*100), passed=pct>=75;
    if(pct>state.best){state.best=pct; state.examDate=new Date().toISOString().slice(0,10);}
    save(); buildNav();
    result.innerHTML="";
    result.appendChild(el(`<div style="margin-top:34px"><div class="score">${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p>${correct} of ${EXAM.length} correct. ${passed?"That is a pass.":"You need 75%. Review the explanations above and retake it."}</p></div>`));
    result.appendChild(buildReportBox(pct,correct,passed));
    const retake=el(`<div class="navrow"><button class="btn ghost" id="retake">Retake the exam</button></div>`);
    retake.querySelector("#retake").addEventListener("click",()=>renderExam());
    result.appendChild(retake);
    result.scrollIntoView({behavior:"smooth",block:"start"});
  });
  main.focus(); window.scrollTo(0,0);
}

function reportPayload(pct,correct){
  return {
    course:"Ticket system", name:state.name, email:state.email,
    date:new Date().toISOString(),
    modulesCompleted:state.done.filter(id=>id!=="start").length,
    modulesTotal:MODULES.length-1,
    moduleScores:Object.keys(state.scores).map(k=>`${k}:${state.scores[k].c}/${state.scores[k].t}`).join(", "),
    examScorePct:pct, examCorrect:correct, examTotal:EXAM.length,
    passed:pct>=75
  };
}

function buildReportBox(pct,correct,passed){
  const p=reportPayload(pct,correct);
  const text=`MANAGD ticket system training — result
Name: ${p.name}
Email: ${p.email||"—"}
Date: ${new Date().toLocaleString()}
Chapters completed: ${p.modulesCompleted} of ${p.modulesTotal}
Chapter scores (first attempt): ${p.moduleScores||"—"}
Exam: ${p.examCorrect}/${p.examTotal} = ${p.examScorePct}% — ${p.passed?"PASS":"FAIL"}`;

  const box=el(`<div class="cert">
    <h3>${passed?"Training complete":"Result recorded"}</h3>
    <p class="tiny" style="margin:0 0 14px">Send this to your manager. If automatic sending is switched off, copy the summary or email it.</p>
    <div class="navrow" style="margin-top:0;border:0;padding-top:0">
      <button class="btn" id="sendBtn">Send my results</button>
      <button class="btn ghost" id="copyBtn">Copy summary</button>
      ${CONFIG.managerEmail?`<a class="btn ghost" style="text-decoration:none;display:inline-block" href="mailto:${CONFIG.managerEmail}?subject=${encodeURIComponent("Ticket system training — "+p.name)}&body=${encodeURIComponent(text)}">Email it</a>`:""}
      <button class="btn ghost" id="printBtn">Print</button>
    </div>
    <p class="status" id="sendStatus"></p>
    <textarea readonly id="summaryBox">${text}</textarea>
  </div>`);

  box.querySelector("#copyBtn").addEventListener("click",()=>{
    const ta=box.querySelector("#summaryBox"); ta.select();
    try{document.execCommand("copy");}catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
    box.querySelector("#sendStatus").textContent="Summary copied.";
  });
  box.querySelector("#printBtn").addEventListener("click",()=>window.print());
  box.querySelector("#sendBtn").addEventListener("click",async()=>{
    const st=box.querySelector("#sendStatus"); st.textContent="Sending…";
    if(!CONFIG.reportUrl){
      st.textContent="Automatic sending isn't set up on this copy — use Copy summary or Email it instead.";
      return;
    }
    try{
      // Apps Script web apps don't return CORS headers, so the response
      // body can't be read from the browser — "no-cors" still delivers
      // the POST, we just can't confirm the read side of it here.
      await fetch(CONFIG.reportUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
      state.sent=true; save();
      st.textContent="Sent — it should appear in the team sheet in a few seconds.";
    }catch(e){
      st.textContent="Could not reach the results sheet — use Copy summary or Email it instead.";
    }
  });
  return box;
}

/* ======================= NAV ======================= */
function buildNav(){
  const list=document.getElementById("navList"); if(!list) return;
  list.innerHTML="";
  MODULES.forEach(m=>{
    const li=el(`<li class="${state.done.includes(m.id)?"done":""}"><button type="button"><span class="mk"></span>${m.nav}</button></li>`);
    li.querySelector("button").addEventListener("click",()=>go(m.id));
    if(m.id===current) li.querySelector("button").setAttribute("aria-current","true");
    list.appendChild(li);
  });
  const ex=el(`<li class="${state.best>=75?"done":""}"><button type="button"><span class="mk"></span>Final exam</button></li>`);
  ex.querySelector("button").addEventListener("click",()=>go("exam"));
  if(current==="exam") ex.querySelector("button").setAttribute("aria-current","true");
  list.appendChild(ex);
}
function updateProgress(){
  const num=document.getElementById("progNum"); if(!num) return;
  const total=MODULES.length, done=state.done.length;
  num.textContent=`${done} of ${total}`;
  document.getElementById("ringFill").setAttribute("stroke-dashoffset", 2*Math.PI*15.5*(1-done/total));
}
function go(id){
  current=id;
  if(id==="exam") renderExam();
  else renderModule(MODULES.find(m=>m.id===id)||MODULES[0]);
  buildNav();
}

/* ======================= BOOT ======================= */
if(state.name) mountShell(); else askName(false);
</script>
