<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F4F6FA;
    margin: 0;
    padding: 40px;
    color: #0F1C4D;
  }
  .brand-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }
  .brand-header svg { height: auto; width: auto; }
  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.2px;
    margin: 44px 0 6px 4px;
    color: #0F1C4D;
  }
  h1:first-of-type { margin-top: 0; }
  p.hint {
    margin: 0 0 18px 4px;
    color: #6B7A99;
    font-size: 15px;
    font-style: italic;
  }
  .toolbar {
    margin: 0 0 14px 4px;
  }
  .toolbar button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1px;
    padding: 8px 18px;
    margin-right: 10px;
    border: 1px solid #276EF1;
    background: #fff;
    color: #0F1C4D;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toolbar button:hover { background: #276EF1; color: #fff; }
  .table-wrap {
    overflow-x: auto;
    background: #FFFFFF;
    border: 1px solid #C7D3EA;
    box-shadow: 0 2px 16px rgba(15,28,77,0.08);
    border-radius: 10px;
    margin-bottom: 48px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1550px;
  }
  th, td {
    border: 1px solid #E3E8F3;
    text-align: center;
    padding: 10px 6px;
    font-size: 14px;
    white-space: nowrap;
  }
  th.staff-col, td.staff-col {
    text-align: left;
    padding-left: 16px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: #FFFFFF;
    position: sticky;
    left: 0;
    z-index: 2;
    min-width: 120px;
    border-right: 1px solid #276EF1;
    color: #0F1C4D;
  }
  .corner { background: #FFFFFF; z-index: 3; }
  tr.week-row th {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.8px;
    padding: 10px 6px;
    color: #fff;
    text-transform: uppercase;
  }
  .week1 { background: #0F1C4D; }
  .week2 { background: #276EF1; }
  .week3 { background: #1B3A7A; }
  .week4 { background: #4A86F0; }
  tr.date-row th { background: #F4F6FA; font-weight: 700; color: #0F1C4D; font-size: 14px; }
  tr.day-row th { background: #E9EEFA; font-weight: 600; color: #4A5A80; font-size: 12.5px; letter-spacing: 0.5px; text-transform: uppercase; }
  td.status-cell {
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    font-size: 16px;
  }
  td.status-cell:hover { filter: brightness(0.96); }
  td.check { background: #E4EDFC; color: #276EF1; }
  td.cross { color: #C0405A; background: #FBF0F1; }
  td.na { color: #A0AAC2; background: #FAFBFD; }
  tr.count-row td, tr.count-row th {
    font-weight: 700;
    background: #F4F6FA;
    color: #0F1C4D;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  td.actions-col {
    text-align: center;
    background: #FFFFFF;
    white-space: nowrap;
    padding: 4px 6px;
    min-width: 60px;
  }
  td.actions-col button {
    font-size: 12px;
    width: 24px;
    height: 24px;
    line-height: 1;
    margin: 0 2px;
    border: 1px solid #C7D3EA;
    border-radius: 3px;
    cursor: pointer;
    background: #fff;
    padding: 0;
    opacity: 0.75;
    transition: all 0.15s ease;
  }
  td.actions-col button:hover { opacity: 1; }
  td.actions-col button.rename-btn:hover { background: #E9EEFA; border-color: #276EF1; }
  td.actions-col button.delete-btn:hover { background: #FBF0F1; border-color: #C0405A; }
</style>
</head>
<body>

<div class="brand-header">

</div>

<div id="app"></div>

<script>
const CYCLE = ["check","cross","na"];
const SYMBOL = { check: "✓", cross: "✕", na: "⊘" };

// ---- Schedule definitions ----
const SCHEDULES = [
  {
    key: "aug",
    title: "Staff Schedule — 31 Jul to 27 Aug 2026",
    storageKey: "vybe_staff_schedule_aug_v1",
    weeks: [
      { label: "Week 1", cls: "week1", days: [["31 Jul","Fri"],["01 Aug","Sat"],["02 Aug","Sun"],["03 Aug","Mon"],["04 Aug","Tue"],["05 Aug","Wed"],["06 Aug","Thu"]] },
      { label: "Week 2", cls: "week2", days: [["07 Aug","Fri"],["08 Aug","Sat"],["09 Aug","Sun"],["10 Aug","Mon"],["11 Aug","Tue"],["12 Aug","Wed"],["13 Aug","Thu"]] },
      { label: "Week 3", cls: "week3", days: [["14 Aug","Fri"],["15 Aug","Sat"],["16 Aug","Sun"],["17 Aug","Mon"],["18 Aug","Tue"],["19 Aug","Wed"],["20 Aug","Thu"]] },
      { label: "Week 4", cls: "week4", days: [["21 Aug","Fri"],["22 Aug","Sat"],["23 Aug","Sun"],["24 Aug","Mon"],["25 Aug","Tue"],["26 Aug","Wed"],["27 Aug","Thu"]] }
    ],
    defaultData: {
      staff: [
        { name: "Hamza",   status: ["check","check","cross","check","check","check","check","check","cross","check","check","check","check","check","check","cross","cross","check","check","check","check","cross","cross","check","check","check","check","check"] },
        { name: "Jill",    status: ["check","cross","check","check","check","check","check","check","check","cross","check","check","check","check","check","check","cross","cross","check","check","check","check","check","cross","cross","check","check","check"] },
        { name: "Mohamed", status: ["check","cross","cross","na","na","na","na","na","na","na","na","na","na","na","na","na","check","check","check","check","check","check","cross","cross","check","check","check","check"] },
        { name: "Gihan",   status: ["na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na","na"] }
      ]
    }
  }
];

const state = {};

function loadData(sched) {
  const raw = localStorage.getItem(sched.storageKey);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return JSON.parse(JSON.stringify(sched.defaultData));
}

function saveData(sched) {
  localStorage.setItem(sched.storageKey, JSON.stringify(state[sched.key]));
}

function buildTableSkeleton(sched) {
  const numDays = sched.weeks.reduce((a,w) => a + w.days.length, 0);

  let weekRow = '<th class="corner"></th>';
  sched.weeks.forEach(w => {
    weekRow += `<th colspan="${w.days.length}" class="${w.cls}">${w.label}</th>`;
  });
  weekRow += '<th></th>';

  let dateRow = '<th class="staff-col corner">Staff Name</th>';
  let dayRow = '<th class="staff-col corner"></th>';
  sched.weeks.forEach(w => {
    w.days.forEach(([date, day]) => {
      dateRow += `<th>${date}</th>`;
      dayRow += `<th>${day}</th>`;
    });
  });
  dateRow += '<th>Actions</th>';
  dayRow += '<th></th>';

  let countRow = '<td class="staff-col">No. Of Staff</td>';
  for (let d = 0; d < numDays; d++) {
    countRow += `<td id="${sched.key}-cnt${d}"></td>`;
  }
  countRow += '<td></td>';

  return `
    <div class="toolbar">
      <button onclick="addStaff('${sched.key}')">Add staff</button>
      <button onclick="resetData('${sched.key}')">Reset to original</button>
      <button onclick="exportJSON('${sched.key}')">Export</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr class="week-row">${weekRow}</tr>
        <tr class="date-row">${dateRow}</tr>
        <tr class="day-row">${dayRow}</tr>
      </thead>
      <tbody id="${sched.key}-body"></tbody>
      <tfoot>
        <tr class="count-row">${countRow}</tr>
      </tfoot>
    </table>
    </div>
  `;
}

function render(key) {
  const sched = SCHEDULES.find(s => s.key === key);
  const data = state[key];
  const numDays = sched.weeks.reduce((a,w) => a + w.days.length, 0);
  const body = document.getElementById(key + '-body');
  body.innerHTML = '';

  data.staff.forEach((person, rowIdx) => {
    const tr = document.createElement('tr');

    const nameTd = document.createElement('td');
    nameTd.className = 'staff-col';
    nameTd.textContent = person.name;
    tr.appendChild(nameTd);

    for (let d = 0; d < numDays; d++) {
      const td = document.createElement('td');
      td.className = 'status-cell ' + person.status[d];
      td.textContent = SYMBOL[person.status[d]];
      td.addEventListener('click', () => {
        const cur = data.staff[rowIdx].status[d];
        const next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
        data.staff[rowIdx].status[d] = next;
        saveData(sched);
        render(key);
      });
      tr.appendChild(td);
    }

    const actionsTd = document.createElement('td');
    actionsTd.className = 'actions-col';

    const renameBtn = document.createElement('button');
    renameBtn.className = 'rename-btn';
    renameBtn.textContent = '✏️';
    renameBtn.title = 'Rename';
    renameBtn.addEventListener('click', () => {
      const newName = prompt('Rename staff member:', person.name);
      if (newName && newName.trim()) {
        data.staff[rowIdx].name = newName.trim();
        saveData(sched);
        render(key);
      }
    });
    actionsTd.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '🗑️';
    delBtn.title = 'Delete';
    delBtn.addEventListener('click', () => {
      if (confirm('Remove ' + person.name + ' from the schedule?')) {
        data.staff.splice(rowIdx, 1);
        saveData(sched);
        render(key);
      }
    });
    actionsTd.appendChild(delBtn);

    tr.appendChild(actionsTd);
    body.appendChild(tr);
  });

  for (let d = 0; d < numDays; d++) {
    const count = data.staff.filter(p => p.status[d] === 'check').length;
    document.getElementById(key + '-cnt' + d).textContent = count;
  }
}

function addStaff(key) {
  const sched = SCHEDULES.find(s => s.key === key);
  const numDays = sched.weeks.reduce((a,w) => a + w.days.length, 0);
  const name = prompt('New staff name:', 'New Staff');
  if (!name) return;
  state[key].staff.push({ name: name, status: Array(numDays).fill('na') });
  saveData(sched);
  render(key);
}

function resetData(key) {
  const sched = SCHEDULES.find(s => s.key === key);
  if (confirm('Reset this table to its original data? This discards your edits.')) {
    state[key] = JSON.parse(JSON.stringify(sched.defaultData));
    saveData(sched);
    render(key);
  }
}

function exportJSON(key) {
  const sched = SCHEDULES.find(s => s.key === key);
  const blob = new Blob([JSON.stringify(state[key], null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sched.key + '_schedule_backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ---- Build page ----
const app = document.getElementById('app');
SCHEDULES.forEach(sched => {
  const h1 = document.createElement('h1');
  h1.textContent = sched.title;
  app.appendChild(h1);

  const div = document.createElement('div');
  div.innerHTML = buildTableSkeleton(sched);
  app.appendChild(div);

  state[sched.key] = loadData(sched);
});

SCHEDULES.forEach(sched => render(sched.key));
</script>

</body>
</html>
