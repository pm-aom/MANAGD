<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANAGD — Practical Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* ========== MANAGD Practical Assessment ========== */
:root{
  --navy:#0F1C4D;
  --blue:#276EF1;
  --blue-dim:#D5E2FD;
  --ink:#161C33;
  --mute:#5B6480;
  --rule:#DCE1EC;
  --paper:#FFFFFF;
  --bg:#F1F3F8;
  --tint:#F5F8FD;
  --bad:#B42318;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#E8ECF7;
    --blue:#5C93F8;
    --blue-dim:#1C2B57;
    --ink:#E6E9F2;
    --mute:#99A2BC;
    --rule:#2A3353;
    --paper:#161C33;
    --bg:#0D1226;
    --tint:#1A2244;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.ui{font-family:Poppins,Inter,sans-serif}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}

/* ---------- masthead ---------- */
header{padding:38px 0 0}
.logo{display:block;width:132px;height:auto}
.logo.on-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo.on-light{display:none}
  :root:not([data-theme="light"]) .logo.on-dark{display:block}
}

.kicker{
  font-family:Poppins,Inter,sans-serif;
  font-size:11.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);margin:26px 0 8px;
}

h1{font-size:34px;line-height:1.16;font-weight:600;letter-spacing:-.02em;color:var(--navy);margin:0 0 14px}
h2{font-size:22px;line-height:1.26;font-weight:600;letter-spacing:-.015em;color:var(--navy);margin:0 0 10px}
h3{font-size:16.5px;font-weight:600;color:var(--navy);margin:26px 0 8px}

p{margin:0 0 14px}
.lede{font-size:17.5px;color:var(--mute);margin:0 0 22px}
.tiny{font-size:13.5px;color:var(--mute)}

/* ---------- card ---------- */
.card{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:30px 32px;
  margin:0 0 20px;
}
@media (max-width:560px){ .card{padding:22px 18px} h1{font-size:28px} }

/* ---------- progress ---------- */
.prog{display:flex;gap:6px;margin:26px 0 22px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--rule);transition:background .25s}
.prog i.on{background:var(--blue)}
.prog i.now{background:var(--navy)}

/* ---------- form ---------- */
.field{margin:0 0 16px}
label{display:block;font-family:Poppins,Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--navy);margin:0 0 6px}
input[type=text],input[type=email],textarea{
  font-family:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  padding:12px 14px;border:1px solid var(--rule);border-radius:9px;width:100%;
}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}

.btn{
  font-family:Poppins,Inter,sans-serif;font-size:15px;font-weight:600;
  background:var(--blue);color:#fff;border:0;border-radius:10px;
  padding:13px 24px;cursor:pointer;transition:opacity .15s;
}
.btn:hover{opacity:.9}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--rule)}

.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
.gate{font-size:13.5px;color:var(--mute)}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:1px}

/* ---------- inbox / ordering ---------- */
.inbox{list-style:none;margin:0 0 6px;padding:0;counter-reset:n}
.item{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--paper);border:1px solid var(--rule);border-radius:11px;
  padding:14px 14px 14px 16px;margin:0 0 9px;cursor:grab;
}
.item.drag{opacity:.4}
.item.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-dim)}
.rank{
  flex:none;width:28px;height:28px;border-radius:50%;
  background:var(--blue-dim);color:var(--navy);
  font-family:Poppins,Inter,sans-serif;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rank{color:var(--blue)} }
.body{flex:1;min-width:0}
.src{font-family:Poppins,Inter,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:3px}
.txt{font-size:15px;line-height:1.5}
.arrows{flex:none;display:flex;flex-direction:column;gap:3px}
.arrows button{
  width:30px;height:26px;border:1px solid var(--rule);background:var(--paper);
  color:var(--mute);border-radius:7px;cursor:pointer;font-size:12px;line-height:1;
}
.arrows button:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.arrows button[disabled]{opacity:.3;cursor:default}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.ev{
  display:block;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--rule);border-radius:11px;
  padding:15px 18px;margin:0 0 9px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .15s,background .15s;
}
.ev:hover{border-color:var(--blue)}
.ev.sel{border-color:var(--blue);background:var(--blue-dim)}
.ev .when{font-family:Poppins,Inter,sans-serif;font-size:13px;font-weight:600;color:var(--blue);display:block;margin-bottom:4px}
.ev.sel .when{color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ev.sel .when{color:var(--blue)} }
.ev .what{font-size:15px;line-height:1.52}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin:20px 0 0}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;
  background:var(--paper);border:1px solid var(--rule);border-radius:11px;
  padding:14px 17px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-dim)}
.opt .mark{
  flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);
  margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:transparent;
}
.opt.sel .mark{border-color:var(--blue);background:var(--blue);color:#fff}
.opt .lab{flex:1;font-size:15.5px;line-height:1.5}

.situation{
  background:var(--tint);border-left:3px solid var(--blue);
  border-radius:0 9px 9px 0;padding:16px 20px;margin:0 0 6px;
}
.situation p:last-child{margin-bottom:0}

.ask{font-family:Poppins,Inter,sans-serif;font-weight:600;color:var(--navy);margin:20px 0 0}

/* ---------- done ---------- */
.done{text-align:center;padding:40px 0 10px}
.done .tick{
  width:58px;height:58px;border-radius:50%;background:var(--blue-dim);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  color:var(--blue);font-size:26px;
}

footer{margin-top:30px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>

    { id:"t5", when:"2 October",

    opts:[
      "Send her your lower figure \u2014 you know this tenant, and a vacancy costs the owner more than the difference.",

<script>
/* ================= config ================= */
const CONFIG = {
  // Paste the Google Apps Script web-app URL here to collect results.
  reportUrl: "https://script.google.com/macros/s/AKfycbyx9cFXYavVgzQ6ynxuK77pSFkZoNC5a0O3hTPycfNNINp0y_HYx5eZdpRFt3fHAA/exec"
};

/* ================= state ================= */
const KEY = "managd-assessment-v2";
let S = { name:"", email:"", order:INBOX.map(x=>x.id), tlPick:"", tlWhy:"", ans:{}, t:{}, started:0 };
try { const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); } catch(e){}

/* Saved progress may come from an older version of this page, with items that no
   longer exist. Reconcile it against the current content before anything renders. */
(function reconcile(){
  const ids = INBOX.map(x=>x.id);
  const kept = (Array.isArray(S.order) ? S.order : []).filter(id => ids.indexOf(id) !== -1);
  ids.forEach(id => { if(kept.indexOf(id) === -1) kept.push(id); });
  S.order = kept;

  if(S.tlPick && !TIMELINE.events.some(e => e.id === S.tlPick)) S.tlPick = "";

  const caseIds = CASES.map(c=>c.id);
  const ans = {};
  Object.keys(S.ans || {}).forEach(k => {
    if(caseIds.indexOf(k) !== -1) ans[k] = S.ans[k];
  });
  S.ans = ans;
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const STEPS = ["inbox","timeline"].concat(CASES.map(c=>c.id));
let step = 0, stepStart = 0;

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const app = () => document.getElementById("app");

function progress(){
  const p = el('<div class="prog"></div>');
  STEPS.forEach((_,i)=>{
    const b=document.createElement("i");
    if(i<step) b.className="on";
    if(i===step) b.className="now";
    p.appendChild(b);
  });
  return p;
}

function markTime(){
  if(stepStart){ const k=STEPS[step]; S.t[k]=(S.t[k]||0)+Math.round((Date.now()-stepStart)/1000); save(); }
}
function enter(){ stepStart = Date.now(); }

/* ================= screens ================= */

function screenIntro(){
  app().innerHTML = "";
  app().appendChild(el(`
    <div>
      <p class="kicker">Tenant Coordinator</p>
      <h1>Practical Assessment</h1>
      <p class="lede">Six short exercises based on real situations from our day-to-day work. It takes about 25 minutes.</p>
      <div class="card">
        <h2>Before you start</h2>
        <p>You are not expected to know how Managd works internally — nothing here depends on our procedures, our systems or our fee structure.</p>
        <p>Most of these situations have more than one defensible answer. We are interested in how you weigh them up, so answer as you would on an ordinary working day rather than looking for the textbook response.</p>
        <p>You will not see a score. Your answers go to the interviewer, and we will talk them through together afterwards.</p>
        <div class="field"><label for="n">Full name</label><input type="text" id="n" value="${esc(S.name)}" placeholder="e.g. Amina Hassan"></div>
        <div class="field"><label for="e">Email address</label><input type="email" id="e" value="${esc(S.email)}" placeholder="name@example.com"></div>
        <div class="navrow"><button class="btn" id="go">Start</button></div>
        <p class="err" id="err"></p>
      </div>
    </div>`));

  document.getElementById("go").onclick = ()=>{
    const n=document.getElementById("n").value.trim();
    const e=document.getElementById("e").value.trim();
    const err=document.getElementById("err");
    if(n.length<2){ err.textContent="Please enter your full name."; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ err.textContent="Please enter a valid email address."; return; }
    S.name=n; S.email=e; S.started=S.started||Date.now(); save();
    step=0; render();
  };
  document.getElementById("n").focus();
}

/* ---------- 1. inbox ordering ---------- */
function screenInbox(){
  const a=app(); a.innerHTML="";
  a.appendChild(progress());
  a.appendChild(el(`
    <div>
      <p class="kicker">Exercise 1 of 6</p>
      <h2>Monday morning</h2>
      <p class="lede">It is Monday, 9:00. You are back after two days off, and five things are waiting for you.</p>
      <div class="card" style="padding-bottom:24px">
        <p><b>Put them in the order you would deal with them.</b> The one you would handle first goes at the top; the one that can wait longest goes at the bottom.</p>
        <p>To move an item, drag it with the mouse, or use the <b>&#9650;</b> and <b>&#9660;</b> buttons on its right. The number on the left shows its place in your order.</p>
        <p class="tiny">There is no single right order. We will ask you about your reasoning afterwards, so put them the way you would really work.</p>
        <ul class="inbox" id="inbox"></ul>
      </div>
      <div class="navrow"><button class="btn" id="next">Continue</button></div>
    </div>`));

  const list=document.getElementById("inbox");
  function paint(){
    list.innerHTML="";
    S.order.forEach((id,idx)=>{
      const it=INBOX.find(x=>x.id===id);
      const li=el(`<li class="item" draggable="true" data-id="${id}">
        <span class="rank">${idx+1}</span>
        <span class="body"><span class="src">${esc(it.src)}</span><span class="txt">${esc(it.txt)}</span></span>
        <span class="arrows">
          <button type="button" data-d="-1" ${idx===0?"disabled":""} aria-label="Move up">▲</button>
          <button type="button" data-d="1" ${idx===S.order.length-1?"disabled":""} aria-label="Move down">▼</button>
        </span>
      </li>`);
      li.querySelectorAll(".arrows button").forEach(b=>{
        b.onclick=()=>{ const d=+b.dataset.d, j=idx+d;
          if(j<0||j>=S.order.length) return;
          const o=S.order.slice(); const [x]=o.splice(idx,1); o.splice(j,0,x);
          S.order=o; save(); paint();
        };
      });
      li.addEventListener("dragstart",ev=>{ ev.dataTransfer.setData("text/plain",id); li.classList.add("drag"); });
      li.addEventListener("dragend",()=>{ li.classList.remove("drag"); list.querySelectorAll(".item").forEach(n=>n.classList.remove("over")); });
      li.addEventListener("dragover",ev=>{ ev.preventDefault(); li.classList.add("over"); });
      li.addEventListener("dragleave",()=>li.classList.remove("over"));
      li.addEventListener("drop",ev=>{
        ev.preventDefault(); li.classList.remove("over");
        const from=ev.dataTransfer.getData("text/plain"); if(from===id) return;
        const o=S.order.slice();
        o.splice(o.indexOf(from),1);
        o.splice(o.indexOf(id),0,from);
        S.order=o; save(); paint();
      });
      list.appendChild(li);
    });
  }
  paint();

  document.getElementById("next").onclick=()=>{ markTime(); step=1; render(); };
}

/* ---------- 2. timeline ---------- */
function screenTimeline(){
  const a=app(); a.innerHTML="";
  a.appendChild(progress());
  a.appendChild(el(`
    <div>
      <p class="kicker">Exercise 2 of 6</p>
      <h2>Where did it go wrong?</h2>
      <p class="lede">${esc(TIMELINE.intro)}</p>
      <div class="card">
        <p><b>Click the moment where you think the mistake was made</b> — the point at which someone should have acted differently. Then explain your choice in the box below.</p>
        <p class="tiny">Only one moment can be selected. You can change your choice before continuing.</p>
        <ul class="tl" id="tl"></ul>
      </div>
      <div class="card">
        <div class="field">
          <label for="tw">${esc(TIMELINE.ask)}</label>
          <textarea id="tw" placeholder="Two or three sentences.">${esc(S.tlWhy||"")}</textarea>
        </div>
        <div class="navrow"><button class="btn" id="next">Continue</button><span class="gate" id="gate"></span></div>
      </div>
    </div>`));

  const tl=document.getElementById("tl");
  TIMELINE.events.forEach(ev=>{
    const b=el(`<li><button class="ev${S.tlPick===ev.id?" sel":""}" data-id="${ev.id}">
      <span class="when">${esc(ev.when)}</span><span class="what">${esc(ev.what)}</span></button></li>`);
    b.querySelector("button").onclick=()=>{
      S.tlPick=ev.id; save();
      tl.querySelectorAll(".ev").forEach(n=>n.classList.toggle("sel", n.dataset.id===ev.id));
      check();
    };
    tl.appendChild(b);
  });

  const tw=document.getElementById("tw"), gate=document.getElementById("gate"), next=document.getElementById("next");
  function check(){
    const ok = !!S.tlPick && tw.value.trim().length>=20;
    next.disabled=!ok;
    gate.textContent = ok ? "" : (!S.tlPick ? "Choose the moment first." : "Please explain your choice.");
  }
  tw.oninput=()=>{ S.tlWhy=tw.value; save(); check(); };
  check();
  next.onclick=()=>{ markTime(); step=2; render(); };
}

/* ---------- 3-6. cases ---------- */
function screenCase(ci){
  const c=CASES[ci], a=app(); a.innerHTML="";
  a.appendChild(progress());
  const sit=c.situation.map(p=>`<p>${esc(p)}</p>`).join("");
  a.appendChild(el(`
    <div>
      <p class="kicker">Exercise ${ci+3} of 6</p>
      <h2>${esc(c.title)}</h2>
      <div class="card">
        <div class="situation">${sit}</div>
        <p class="ask">${esc(c.ask)}</p>
        <div class="opts" id="opts"></div>
        <div class="navrow"><button class="btn" id="next">${ci===CASES.length-1?"Finish":"Continue"}</button><span class="gate" id="gate"></span></div>
      </div>
    </div>`));

  const box=document.getElementById("opts"), gate=document.getElementById("gate"), next=document.getElementById("next");
  const letters="ABCD";
  c.opts.forEach((o,i)=>{
    const b=el(`<button class="opt${S.ans[c.id]===i?" sel":""}" data-i="${i}">
      <span class="mark">${letters[i]}</span><span class="lab">${esc(o)}</span></button>`);
    b.onclick=()=>{
      S.ans[c.id]=i; save();
      box.querySelectorAll(".opt").forEach(n=>n.classList.toggle("sel", +n.dataset.i===i));
      check();
    };
    box.appendChild(b);
  });
  function check(){
    const ok = S.ans[c.id]!==undefined;
    next.disabled=!ok;
    gate.textContent = ok ? "" : "Choose one option.";
  }
  check();
  next.onclick=()=>{
    markTime();
    if(ci===CASES.length-1){ submit(); } else { step=ci+3; render(); }
  };
}

/* ---------- done ---------- */
function submit(){
  const payload = {
    kind:"tc-practical-assessment",
    version:1,
    name:S.name,
    email:S.email,
    submittedAt:new Date().toISOString(),
    totalSeconds: Math.round((Date.now()-(S.started||Date.now()))/1000),
    sectionSeconds:S.t,
    inboxOrder:S.order.join(" > "),
    timelinePick:S.tlPick,
    timelineReason:S.tlWhy||"",
    answers: CASES.map(c=>({
      id:c.id,
      chosen:"ABCD"[S.ans[c.id]] || "",
      correct:"ABCD"[c.key],
      match:(S.ans[c.id]===c.key)
    })),
    flags:{
      leaseBeforeOwnerEmail: S.order.indexOf("i3") < S.order.indexOf("i1"),
      loudTenantInTopHalf: S.order.indexOf("i2") < 3,
      listingNoticeBeforeOwnerEmail: S.order.indexOf("i5") < S.order.indexOf("i1")
    }
  };
  if(CONFIG.reportUrl){
    try{
      fetch(CONFIG.reportUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    }catch(e){}
  }
  try{ localStorage.setItem(KEY+"-result", JSON.stringify(payload)); }catch(e){}

  app().innerHTML="";
  app().appendChild(el(`
    <div class="card done">
      <div class="tick">✓</div>
      <h2>Thank you, ${esc(S.name.split(" ")[0])}</h2>
      <p class="lede" style="max-width:420px;margin:0 auto">Your answers have been sent to the interviewer. We will go through them with you in the conversation.</p>
      <p class="tiny" style="margin-top:22px">You can close this page.</p>
    </div>`));
  window.scrollTo(0,0);
}

/* ================= router ================= */
function render(){
  enter();
  if(step===0) screenInbox();
  else if(step===1) screenTimeline();
  else screenCase(step-2);
  window.scrollTo(0,0);
}

screenIntro();
</script>
</body>
