    ["2nd","Outstanding Ejari and administrative penalties payable to Managd"],
    ["3rd","Outstanding late payment fees payable to Managd"],
    ["4th","Outstanding bounced cheque penalties payable to Managd"],
    ["5th","Arrears of rent — oldest period first — payable to DGMA"],
    ["6th","Current rent due, payable to DGMA"]
  ]}},
  {t:"callout",v:"<b>This is why a tenant can pay in full and still show as behind on rent.</b> If they owe a AED 500 fine, their next rent cheque clearing gets AED 500 of it absorbed by the fine first — the rest counts as a partial rent payment, and the shortfall is treated as unpaid rent, which can itself trigger the late payment penalty. You must notify the tenant in writing within 3 working days whenever a waterfall allocation causes a rent shortfall — this is the conversation that prevents a confused, angry tenant."},
  {t:"h",v:"Maintenance — the same AED 500 line, from the tenant's actual contract"},
  {t:"p",v:"The Addendum confirms the line from Module 8: maintenance costs below AED 500 per occurrence are borne by the tenant. For works above AED 500 that fall within the owner's responsibility, the tenant must submit a written request to Managd, who coordinates using its approved contractor panel — the tenant may not engage independent contractors above AED 500 without Managd's prior written approval. A water leak or structural issue must be reported immediately in writing; if a delay in reporting makes the damage worse, that additional damage becomes the tenant's liability."},
  {t:"h",v:"Pets, subletting, and the penalties that follow"},
  {t:"table",v:{head:["Situation","What's required","Penalty if not followed"],rows:[
    ["Keeping a pet","Prior written landlord approval, declared at signing; if approved, an additional 5% refundable security deposit is due before the pet arrives","Without approval: AED 2,500 penalty payable to Managd, plus immediate eviction proceedings"],
    ["Subletting or short-term/holiday letting (Airbnb etc.)","Prior written landlord consent for any subletting","Immediate termination of the tenancy, plus a penalty of three months' rent payable to the landlord within 5 working days — recoverable through legal proceedings, with court costs borne by the tenant"],
    ["General violations (noise, cleanliness, conduct, damage to common areas)","Compliance with community and house rules","First violation: AED 500 to Managd. Second and subsequent violations: AED 1,000 per instance to Managd"]
  ]}},
  {t:"h",v:"When a tenant wants to get a pet during the tenancy"},
  {t:"p",v:"At signing, every tenant declares in writing whether a pet will be kept. Plans change — a tenant who declared “no pet” may later want to adopt a dog or a cat. The contract rule is the same at any point of the tenancy: <b>written approval from the landlord first, the additional deposit second, the pet third.</b>"},
  {t:"flow",v:[["1","Tenant asks Managd in writing — before the pet arrives"],["2","Managd asks the owner for written approval (the decision is the owner's, not ours)"],["3","If approved: tenant pays the additional 5% refundable security deposit"],["4","Only then may the pet be brought into the unit"],["5","Approval, deposit and the updated pet declaration are documented in the platform"]]},
  {t:"list",v:[
    "Do not promise anything while the owner has not answered — “I've passed it on and will come back to you with the owner's answer” is the right sentence.",
    "If the owner declines, the answer is no. There is no fee that turns a refusal into a yes.",
    "After approval the tenant is fully responsible for the pet's behaviour, cleanliness and any damage in or outside the unit. Pet-care, cleanliness and noise issues count as violations: AED 500 for the first, AED 1,000 for each further one, payable to Managd.",
    "The additional 5% is part of the security deposit: refundable at move-out under the same rules, less deductions for damage beyond normal wear and tear.",
    "If a pet is already living in the unit without written approval, that is a material breach: an AED 2,500 penalty payable to Managd and grounds for immediate eviction proceedings. Do not “fix” it by approving it yourself — document it and escalate it."
  ]},
  {t:"scenario",v:{from:"Tenant, month five",msg:"We're thinking of adopting a small dog next month. That's okay, right? It's really quiet.",
   o:["Request the owner's written approval now; if approved, 5% extra deposit before the dog arrives","Request approval now, and let the dog move in while the owner decides — the extra deposit follows","Fine, as long as they pay the extra 5% deposit before the dog arrives","Fine — asking before the pet arrives is exactly what the contract requires"],
   c:0,w:"Approval → deposit → pet, in that order. Size and temperament do not change the rule, and the decision belongs to the owner."}},
  {t:"h",v:"Community rules, access and alterations"},
  {t:"list",v:[
    "The tenant follows the Master Community Rules, Owners Association Rules and Internal House Rules. Quiet hours are 10:00 PM to 10:00 AM.",
    "Fines levied on the landlord by building management because of the tenant (noise, littering, parking) are borne by the tenant, payable within 5 working days of Managd's written notification.",
    "The unit is for single-family residential use only — no commercial, business or professional use.",
    "Access: 24 hours' prior notice for maintenance, inspections, repairs or potential buyers; immediate access in emergencies. Continued refusal after two written notices is a material breach and grounds for non-renewal or eviction proceedings.",
    "No structural alterations, installations or modifications without prior written approval of the landlord or Managd; no carpets glued or nailed to tiles; no wall drilling beyond standard picture hanging. Approved alterations are reversed at the tenant's cost on vacating, otherwise the cost is deducted from the deposit.",
    "House Rules also cover: rubbish in designated areas only, parking only in the tenant's own space, no bulky storage visible on balconies, no laundry visible from outside unless drying areas are provided, no tampering with smoke detectors or fire systems, and damage to common areas by the tenant or guests is charged to the tenant.",
    "The tenant arranges household contents insurance; the landlord carries no liability for the tenant's personal belongings."
  ]},
  {t:"h",v:"Bounced cheques and late payment"},
  {t:"list",v:[
    "First returned cheque (insufficient funds): AED 1,050 to Managd, within 5 working days.",
    "Repeated returned cheque (insufficient funds): AED 2,500 to Managd, within 5 working days.",
    "Returned for irregular signature or another non-funds reason: AED 350 to Managd, within 5 working days.",
    "In every case, an alternative payment for the full rental amount is due within 3 working days of the due date.",
    "A second returned cheque additionally requires the tenant to provide one more postdated cheque, for an extra month's rent as security, within 5 working days.",
    "Late payment penalty: AED 100 per day plus VAT, starting from the 4th day after the due date until paid in full — on top of any other penalty, regardless of payment method."
  ]},
  {t:"h",v:"Security deposit — the details that go beyond the factsheets"},
  {t:"p",v:"The deposit is 5% of the annual rent, plus an additional 5% where a pet has been approved. It is refunded within 45 calendar days from the later of the move-out date or the date all move-out clearances are received and verified — the clock does not start until move-out compliance is complete. Deductions are made only at move-out."},
  {t:"h",v:"Renewal fee and the right to deny renewal"},
  {t:"p",v:"An annual administrative fee of AED 1,150 (including VAT) is payable by the tenant to Managd at each renewal, and a valid Ejari registration is required for the renewal to proceed. Managd and the landlord can decline to renew if, at renewal time, there are unpaid Managd penalties or fines, unpaid administrative or renewal fees, or an unremedied breach — but only after giving the tenant written notice of the outstanding items at least 30 days before lease expiry, with 15 days to fix them."},
  {t:"h",v:"Sale, force majeure, data"},
  {t:"p",v:"If the property is sold during the tenancy, the tenancy transfers to the new owner on the same terms, unless a valid legal eviction notice was served before the sale. Force majeure does not excuse rent unless the unit becomes wholly uninhabitable as a direct result, and only for that period; the landlord is not liable for interruptions caused by developer, utility provider or building management decisions outside its reasonable control. The tenant consents to Managd processing their personal data for managing the tenancy."},
  {t:"scenario",v:{from:"Tenant, annoyed",msg:"I paid my full rent cheque this month and you're telling me I'm still short? That doesn't make sense.",
   o:["Walk them through the payment order — fines and fees first, then rent — with the amounts","Explain that fines come out of the deposit, so the rent shortfall must have another cause","Mark the rent as paid and carry the fines forward separately","Escalate it to Finance as a probable system error"],
   c:0,w:"This is confusing for tenants precisely because it isn't intuitive — walking them through the actual order, with the specific amounts, is what the written notice requirement exists for."}},
  {t:"scenario",v:{from:"Tenant, move-in day",msg:"My sister is bringing her cat when she visits for a month. That's fine, right? It's not really 'my' pet.",
   o:["Not without the owner's prior written approval, before the cat arrives","Fine — a visiting pet is not “kept” in the unit, so no approval is needed","Fine for up to 30 days; a longer stay needs approval","Fine, as long as the extra 5% deposit is paid"],
   c:0,w:"The approval clause covers bringing any pet onto the premises — it does not depend on who owns the pet. Get written approval before the cat arrives, not after."}},
  {t:"quiz",v:{q:"A tenant's rent cheque and an outstanding AED 500 violation fine both come due around the same time, and the tenant only pays the rent amount.",
   o:["The fine is paid first, so the rent is short and the late fee can apply","The rent is paid in full, because the tenant specified the payment as rent","The payment is split proportionally between the fine and the rent","The rent is paid in full, and the fine stays open separately"],
   c:0,w:"The waterfall applies regardless of the tenant's stated intent, and the resulting rent shortfall must be flagged to the tenant in writing within 3 working days."}},
  {t:"quiz",v:{q:"A tenant sublets their unit on Airbnb without telling anyone. What happens under the Addendum?",
   o:["Immediate termination plus three months' rent, due within 5 working days","An AED 2,500 penalty and immediate eviction proceedings, as for other material breaches","A two months' rent penalty, as for early termination","A first violation of AED 500, then AED 1,000 if repeated"],
   c:0,w:"This is one of the most severe penalties in the whole Addendum — immediate termination plus three months' rent, with court and execution costs also falling on the tenant if it goes to legal proceedings."}},
  {t:"quiz",v:{q:"A rent cheque is returned because the signature does not match. What does the Addendum say?",
   o:["AED 350 to Managd, plus replacement of the full rent within 3 working days","AED 1,050 to Managd, as for any first returned cheque, plus a replacement payment","AED 350 to Managd, and the same cheque is simply presented again next month","No penalty — it is a technical issue, not a lack of funds"],
   c:0,w:"The AED 1,050 / AED 2,500 penalties are for insufficient funds. A non-funds reason carries AED 350 — but the rent still has to be replaced within 3 working days."}},
  {t:"scenario",v:{from:"Tenant, after a second written notice",msg:"I'm not letting the technician in, I don't have time for this. Stop sending me notices.",
   o:["State that refusal after two notices is a material breach, offer slots, escalate","Enter with 24 hours' notice anyway — after two written notices the tenant can no longer refuse","Stop the notices and close the job — delays are now the tenant's responsibility","Send a third written notice before anything else can happen"],
   c:0,w:"Access requires 24 hours' notice outside emergencies. After two written notices, refusal becomes a material breach — say so plainly, but keep offering a way forward."}},
  {t:"quiz",v:{q:"Within how many days must the security deposit be refunded, and from when does that period run?",
   o:["Within 45 calendar days from the later of move-out or verified clearance","Within 45 calendar days from the move-out date, whatever documents are still missing","Within 45 working days from the move-out inspection","Within 30 days from handing back the keys"],
   c:0,w:"The 45-day clock is anchored to full compliance, not simply to the tenant leaving — a missing DEWA final clearance or Ejari cancellation pushes the start date later."}}
 ]
},

{
 id:"m11", nav:"13 · Red flags", num:"Module 13", title:"Sentences that must never leave your keyboard",
 lede:"The rules behind each of these come from the documents you have just read. The wording is what you can reuse.",
 blocks:[
  {t:"table",v:{head:["Never say","Say instead"],rows:[
    ["“We'll transfer the DEWA account to you.”","“You open your own DEWA and Empower accounts after Ejari registration. The owner's account stays active so the unit is supplied when it is empty.”"],
    ["“You can sort out DEWA after you move in.”","“Your DEWA — and Empower, if the building is connected — needs to be active and the documents sent to us before move-in. That's what lets us clean the unit for you in time.”"],
    ["“The developer will fix all of that.”","“Functional and clearly visible defects are enforced. Fine scratches and minor inaccuracies stay documented in the report but are realistically not rectified.”"],
    ["“The service charge is too high, we'll get it reduced.”","“The rate is set annually by the owners association and its building management, approved by RERA and billed via Mollak. We have no influence and no vote.”"],
    ["“Just give the money to me and I'll pass it on.”","“Rent and deposits go to DGMA Legal — the only party authorised to receive funds under the Power of Attorney.”"],
    ["“Pay the outstanding bill for now, we'll deduct it later.”","“Invoices of the tenancy period are never taken over by the owner. We'll pursue it with the tenant.”"],
    ["“I'll get this repair done today.” (above AED 1,000)","“Here is the cost estimate. Above AED 1,000 I need the owner's approval before commissioning it.”"],
    ["“We'll take it off your deposit.” (mid-tenancy)","“The deposit is settled only at move-out against the photo protocol. This goes through the normal maintenance process.”"],
    ["“Just transfer it whenever, we'll hold the cheque.”","“A transfer has to be credited at least 5 calendar days before the cheque date, and please send us the proof — otherwise the cheque will be presented.”"],
    ["“Your payment went to the rent.” (when fines are outstanding)","“Payments are applied in a fixed order: Managd fines and fees first, then rent arrears, then current rent. Here is exactly how yours was allocated.”"],
    ["“A month's notice is fine.” / “Give 90 days' notice and you can leave any time.”","“Notice is due at least 90 days before the lease expires. After that the contract has renewed, so leaving counts as early termination — the penalty is two months' rent.”"],
    ["“A visiting pet is fine.”","“Any pet kept in the unit needs the landlord's written approval first — without it there is an AED 2,500 penalty and eviction proceedings.”"],
    ["“Sure, you can get a dog.”","“I'll ask the owner for written approval. If it's approved, an additional 5% deposit is due before the dog moves in.”"],
    ["“Don't worry about the penalty, I'll waive it.”","“These penalties are part of your signed contract. I can't waive them myself — I'll pass your request on and come back to you.”"],
    ["“That's over AED 500, so it's covered by Managd.”","“AED 500 decides who pays for the repair, not who arranges it. Above AED 500 in an occupied unit, the cost is the owner's, unless the damage was caused by misuse or negligence — Managd still coordinates the work.”"],
    ["“I think so.”","“Let me confirm that and come back to you today.”"]
  ]}},
  {t:"scenario",v:{from:"Tenant, on the phone, right now",msg:"Just yes or no — will the balcony grouting be redone before I move in?",
   o:["“It's in the report — I'll check its category and confirm today.”","“It's on the snagging list, so yes, the developer will redo it before you move in.”","“Grouting is cosmetic, so no, it won't be redone.”","“That's the developer's decision — please check with them directly.”"],
   c:0,w:"The pressure to give a yes or no is exactly when the wrong sentence comes out. Naming what you will do and by when satisfies the tenant without committing to something you cannot deliver."}},
  {t:"quiz",v:{q:"You are unsure whether something is covered under a Basic package and the owner is waiting on the line.",
   o:["Tell the owner you will confirm and come back the same day","Say it is not included — it is safer to under-promise","Say it is included, and check afterwards","Refer the owner to DGMA, who manage the packages"],
   c:0,w:"Both guessing directions cost you: under-promising creates an unnecessary upgrade conversation, over-promising creates a service you then deliver for free."}}
 ]
}
];

const EXAM = [
 {q:"What does “Ejari” actually mean, and who pays its registration fee?",o:["Arabic for “landlord”; the owner pays","Arabic for “my rent”; the tenant pays","Arabic for “contract”; split between owner and tenant","It is not an Arabic word — it is a Managd system, and Managd absorbs the cost"],c:1,w:"Ejari is Arabic for “my rent” — the mandatory registration of every tenancy contract with the Dubai Land Department. Managd handles the registration as part of authority liaison, but the tenant pays the fee."},
 {q:"Eight months into the tenancy, a tenant mentions in passing that they adopted a cat three weeks ago. Nobody asked for approval. What is the situation?",o:["Fine — they can simply pay the extra 5% deposit now","A material breach: keeping a pet without prior written landlord approval carries an AED 2,500 penalty payable to Managd and grounds for eviction proceedings — document it and escalate","Only a problem if the neighbours complain","A first violation, AED 500"],c:1,w:"The order is approval → deposit → pet. Once the pet is already there without approval, the breach has happened; the coordinator does not resolve it informally."},
 {q:"Under what circumstances can a tenant actually be given notice to vacate?",o:["Whenever the owner wants to raise the rent significantly","Only for personal use by the owner or a first-degree relative, sale of the property (each with 12 months written notice), or contractual breach by the tenant","Any time after the first year, with 60 days notice","Only if the tenant misses one rent cheque"],c:1,w:"These are the only legal grounds. Personal use and sale both require 12 months written notice; disputes are decided by the Rental Dispute Settlement Centre."},
 {q:"A tenant has an unpaid AED 500 violation fine and asks you to “just take it from my security deposit” now, mid-tenancy.",o:["Agree — it is the simplest way","No — the deposit is settled only at move-out; the fine is paid separately within 5 working days of Managd's written notification, and until it is paid, incoming payments are applied to it first under the Payment Waterfall","Agree, but only with the owner's approval","Deduct it and ask the tenant to top up the deposit later"],c:1,w:"Deductions from the deposit happen only at move-out. Fines are settled on their own deadline — and the waterfall is why an unpaid fine quietly eats into the next rent payment."},
 {q:"An owner asks why Managd didn't check with them before agreeing a new tenancy at the rent level already set in the management agreement.",o:["This should always be checked first, without exception","Within the agreed rent range no renewed consent is needed — consent is required only for a letting below the agreed minimum rent, or an early termination","Managd needs consent only above AED 1,000 in monthly rent","Consent is needed only for Basic package owners"],c:1,w:"Letting within the agreed range happens directly, without renewed consent, so no time is lost before signing. Consent is required specifically for going below the agreed minimum, or for early termination."},
 {q:"A prospective tenant asks for a 6-month lease on a unit. What is the correct answer?",o:["That is fine, Managd offers flexible terms","Residential tenancy contracts in Dubai generally run for at least one year; short-term letting is not offered through Managd","Only Premium-package owners can offer short leases","6 months is possible with an extra security deposit"],c:1,w:"Short-term lettings, monthly or via holiday-rental platforms, require separate permits and are not offered through Managd."},
 {q:"An owner wants their rental payouts sent to their business partner's account instead of their own.",o:["Fine, as long as it's in writing","The account must be in the owner's name — payouts to third parties are not possible, with one exception: spouses","Possible, with DGMA's approval","Possible only under the Premium package"],c:1,w:"The only named exception to “owner's name only” for payouts is a spouse."},
 {q:"A leak from the flat upstairs damages a tenant's laptop. The tenant asks whether the landlord's insurance will pay for it.",o:["Yes, the landlord is liable for everything inside the unit","Under the House Rules the tenant is responsible for household contents insurance, and the landlord carries no liability for the tenant's personal belongings","Managd pays and recovers it from the building","The service charges include contents cover"],c:1,w:"Contents insurance is the tenant's responsibility. Report the leak itself to building management and document it — but do not promise compensation for belongings."},
 {q:"An owner sells their unit while a tenant is still mid-contract. What happens to the tenancy?",o:["It ends automatically on completion of the sale","It transfers to the new owner on the same terms — unless a valid legal eviction notice was served before the sale","The tenant must be given 12 months notice before the sale can complete","Managd terminates it on the owner's behalf"],c:1,w:"An ongoing tenancy is unaffected by the sale and transfers to the buyer; the Addendum adds the one exception — a valid eviction notice served before the sale."},
 {q:"A rent cheque for a new tenancy clears on DGMA's account five days before the tenancy officially starts. When is the owner's payout initiated?",o:["Immediately once the cheque clears, regardless of contract start","Only once the tenancy contract has officially commenced — even though the cheque already cleared","10 days after the contract starts, no exceptions","Whenever the owner requests it"],c:1,w:"Payout is tied to the contract's official commencement date, not simply to the cheque clearing — a detail that explains an otherwise confusing delay to an owner."},
 {q:"Why does the recommended asking rent for a newly vacant unit sometimes come in below what the previous tenant was paying?",o:["Managd applies a standard discount to attract tenants faster","Many expiring contracts were signed at the peak of the rental cycle; pricing at today's market level and letting quickly is usually more profitable over the year than holding out for the old price and absorbing a longer vacancy","It reflects a discount for the specific unit's condition","It only happens for units without a Premium package"],c:1,w:"A month of vacancy typically costs more than a moderate price adjustment — this is a market-timing explanation, not a discount policy."},
 {q:"A snagging report for a new unit lists 40 items. The owner is alarmed. What is the accurate context to give them?",o:["This means the unit is in poor condition compared to others","Reports deliberately document in fine detail, including trivial items, so the count says nothing about the unit's actual condition — and in practice tenants have not declined units over snagging items", "This is unusually high and should be escalated to the developer as a formal complaint","It means the de-snagging step will be skipped"],c:1,w:"Thorough documentation is the intended behaviour — it exists to leave nothing overlooked as a basis against the developer, not to signal poor quality."},
 {q:"Why is the deep cleaning of a new unit carried out only once a tenant is secured, rather than right after snagging is finished?",o:["Cleaning companies are unavailable earlier in the process","Cleaning right after snagging would often need to be repeated before move-in, an unnecessary extra cost — so it is timed once, precisely before the tenant moves in","Deep cleaning is optional and skipped for most units","It is tied to the release of the Empower deposit"],c:1,w:"Timing it to move-in avoids paying for two cleanings. Viewings happen on the show floor, so the individual unit is cleaned precisely once, right before move-in."},
 {q:"A tenancy contract is signed and Ejari is registered. Which order of the next steps is correct at Managd?",o:["Move-in → tenant connects DEWA afterwards → cleaning when convenient","Deep cleaning → move-in → tenant sends DEWA documents","Tenant connects DEWA (and Empower if the building is connected) → all connection documents to Managd → deep cleaning → move-in day with a clean unit","Move-in on the owner's accounts → transfer of the accounts to the tenant"],c:2,w:"The deep cleaning is scheduled only after the tenant's DEWA is connected, so the unit is clean on move-in day."},
 {q:"What is the actual standard used to issue letting clearance on a unit — “every last item on the snagging report is closed”, or something else?",o:["Every single item, including minor cosmetic ones, must be closed first","The unit is cleared once it is functionally sound and makes a flawless overall impression — not only once the very last minor cosmetic item has been closed","Clearance is issued the moment the developer confirms rectification, without our own check","Clearance depends solely on the owner's personal inspection"],c:1,w:"This is stated explicitly as the guiding standard — it is what allows minor cosmetic items to remain open in the report without blocking letting."},
 {q:"A tenant wants to pay the cheque dated the 20th by bank transfer instead. What does the contract require?",o:["The transfer can arrive any time before the 20th","The transfer must be credited at least 5 calendar days before the cheque date — by the 15th — and the tenant sends Managd proof so the cheque is not presented","Transfers are not allowed; only cheques","The transfer must arrive by the 20th and the cheque is returned automatically"],c:1,w:"Five calendar days plus proof of transfer. Otherwise the cheque is presented as normal."},
 {q:"Rent is due and has not been paid. When does the late payment penalty start, and how much is it?",o:["From the day after the due date, AED 100 in total","AED 100 per day plus VAT, from the fourth day after the due date until full payment — regardless of payment method and on top of other penalties","AED 100 per day, only for cheque payments","5% of the rent after one week"],c:1,w:"Addendum 12.6. It also applies to any rent shortfall created by the Payment Waterfall, from the fourth day after the original due date."},
 {q:"A new tenant has not provided the Ejari registration by the lease start date. What applies?",o:["A reminder only — no penalty","AED 500 payable to Managd, once per lease year; the same applies at each renewal where Ejari is not maintained, after a formal written demand","AED 500 per month until registered","AED 100 per day plus VAT"],c:1,w:"Ejari penalties are one-time per lease year, subject to the Payment Waterfall and enforceable at the RDC."},
 {q:"You send a formal demand on WhatsApp on Monday. The tenant says they only read it on Wednesday, so the deadline should run from Wednesday.",o:["Agree and restart the deadline from Wednesday","Formal notices by email or WhatsApp to the registered contact details are deemed received on the day of sending — the deadline runs from Monday","Formal notices are only valid by courier","Send the demand again by email to be safe and restart the clock"],c:1,w:"Addendum 21.2. Keeping contact details current is the tenant's responsibility."},
 {q:"Five weeks before lease expiry, a tenant still owes an AED 1,000 violation fine. What has to happen before Managd and the landlord can decline renewal on that basis?",o:["Nothing — they can decline immediately","Written notice of the outstanding items at least 30 days before expiry; if they are not remedied within 15 days of that notice, renewal can be declined","A court order from the RDC","The tenant must first be fined a second time"],c:1,w:"Right to Deny Renewal, Addendum 13.4 — the notice gives the tenant a real chance to fix it."},
 {q:"Move-out repair costs exceed the security deposit by AED 3,000. What does the contract say?",o:["Managd absorbs the difference","The tenant pays the balance within 5 working days of written demand; from day six, AED 100 per day accrues until paid, and both landlord and Managd can recover through the RDC with costs on the tenant","The owner must claim it from the tenant personally","It is written off after 45 days"],c:1,w:"Addendum 11.4."},
 {q:"Building management fines the owner AED 1,000 because the tenant held a loud party after midnight. Who pays, and by when?",o:["The owner — fines from the building are an owner cost","Managd, as property manager","The tenant, within 5 working days of Managd's written notification","Nobody, because quiet hours are only a recommendation"],c:2,w:"Fines levied on the landlord as a direct result of the tenant's conduct are borne by the tenant. Quiet hours are 10:00 PM to 10:00 AM."},
 {q:"A tenant wants to install built-in shelving that needs wall drilling beyond picture hanging. What applies?",o:["Allowed — tenants may furnish as they like","Prior written approval from the landlord or Managd is required; if approved, the tenant restores the original condition at their own cost on moving out unless otherwise agreed in writing","Allowed if they use Managd's contractor","Never allowed, under any circumstances"],c:1,w:"Alterations need prior written approval, and approved alterations are reinstated at the tenant's cost — otherwise the cost is deducted from the deposit."},
 {q:"In an emergency, Managd used AED 800 of an owner's AED 2,000 maintenance deposit for an urgent repair above the tenant's AED 500 line. What happens next?",o:["The tenant must top up the AED 800","Nothing — the deposit is simply smaller now","The owner tops the maintenance deposit back up to AED 2,000; the owner is informed of the measure as always, and the deposit is refunded at the end of the management agreement","The amount is deducted from the tenant's security deposit"],c:2,w:"The maintenance deposit belongs to the owner's side of the arrangement. It exists so repairs can start immediately, and it is replenished after use."},
 {q:"Six weeks before the lease expires, a tenant writes that they will not renew. What applies?",o:["Nothing — six weeks is enough notice","They must stay for another full year","The contract has already renewed at the 90-day mark, so leaving is an early termination: two months' rent penalty, after which the tenant is free to go","A penalty of one month's rent, because they are only a few weeks late"],c:2,w:"There is only one rule for a tenant who wants out before the contract allows it — two months' rent — and late notice falls under it."},
 {q:"A tenant asks for a rent reduction more than 90 days before the lease expires. Which statement about the “under negotiation” status is correct?",o:["It can stay on until the tenant decides, however long that takes","It lets the coordinator agree a lower rent without the owner","It stops the automatic renewal while the owner is consulted about a possible reduction — it cannot be kept open for long, so the matter has to be resolved quickly","It has no effect on the automatic renewal"],c:2,w:"The status pauses auto-renewal for a short working window with the owner — it is not a parking place and not an approval."},
 {q:"You notice the same move-out problem — missing Ejari cancellation — delaying deposit refunds across several of your units.",o:["Handle each case and move on","Raise it and propose a practical process improvement together with Line Management","Change the move-out checklist yourself without telling anyone","Nothing — it is the tenants' problem"],c:1,w:"Monitoring day-to-day operations for recurring issues and proactively proposing improvements with Line Management is part of the job description."}
];

     <div class="field"><label for="e">Work email (optional)</label><input type="email" id="e" value="${state.email||""}" placeholder="name@getmanagd.com"></div>
     <button class="btn" id="startBtn">${isEdit?"Save":"Start the course"}</button>
     <p class="tiny" id="err" style="color:var(--bad);margin-top:10px"></p>
   </div>`;
  document.getElementById("startBtn").addEventListener("click",()=>{
    const n=document.getElementById("n").value.trim();
    if(n.length<2){document.getElementById("err").textContent="Please enter your name.";return;}
    state.name=n; state.email=document.getElementById("e").value.trim(); save(); mountShell();
  });
  document.getElementById("n").focus();
}

/* ======================= BLOCKS ======================= */
function renderBlocks(blocks,pageId){
  const out=document.createElement("div");
  gradeable[pageId]={total:0,answered:0,correct:0};
  blocks.forEach(b=>{
    if(b.t==="p") out.appendChild(el(`<p>${b.v}</p>`));
    else if(b.t==="h") out.appendChild(el(`<h3>${b.v}</h3>`));
    else if(b.t==="list") out.appendChild(el(`<ul>${b.v.map(i=>`<li>${i}</li>`).join("")}</ul>`));
    else if(b.t==="callout") out.appendChild(el(`<div class="callout">${b.v}</div>`));
    else if(b.t==="table") out.appendChild(el(`<div class="tablewrap"><table><thead><tr>${b.v.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.v.rows.map(r=>`<tr>${r.map(c=>`<td${c==="✓"?' class="yes"':(c==="—"?' class="no"':"")}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`));
    else if(b.t==="flow") out.appendChild(el(`<div class="flow">${b.v.map(s=>`<div><span>Step ${s[0]}</span>${s[1]}</div>`).join("")}</div>`));
    else if(b.t==="cards"){
      const wrap=el(`<div class="cards"></div>`);
      b.v.forEach(c=>{
        const btn=el(`<button class="flip" type="button"></button>`);
        let f=false; const paint=()=>{btn.innerHTML=f?`<span class="b">${c.b}</span>`:`<span>${c.f}</span>`;};
        paint(); btn.addEventListener("click",()=>{f=!f;paint();});
        wrap.appendChild(btn);
      });
      out.appendChild(wrap);
    }
    else if(b.t==="quiz"||b.t==="scenario"){ gradeable[pageId].total++; out.appendChild(buildQuestion(b,pageId)); }
  });
  return out;
}

function buildQuestion(b,pageId){
  const isScen=b.t==="scenario", d=b.v;
  const box=el(`<div class="ex">
    <div class="kind">${isScen?"Scenario — choose your reply":"Check yourself"}</div>
    ${isScen?`<div class="msg"><b>${d.from}</b>${d.msg}</div><p class="q">How do you respond?</p>`:`<p class="q">${d.q}</p>`}
    <div class="opts"></div><div class="why hidden"></div></div>`);
  const opts=box.querySelector(".opts"), why=box.querySelector(".why");
  const order=d.o.map((_,i)=>i);
  for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]];}
  order.forEach(i=>{
    const text=d.o[i];
    const btn=el(`<button class="opt" type="button"></button>`); btn.textContent=text; btn.dataset.i=i;
    btn.addEventListener("click",()=>{
      if(box.dataset.answered) return;
      box.dataset.answered="1";
      [...opts.children].forEach(o=>{o.disabled=true; if(+o.dataset.i===d.c)o.classList.add("right");});
      const ok=i===d.c; if(!ok) btn.classList.add("wrong");
      why.className="why "+(ok?"ok":"no");
      why.innerHTML=`<b>${ok?"Correct.":"Not this one."}</b> ${d.w}`;
      gradeable[pageId].answered++; if(ok) gradeable[pageId].correct++;
      updateGate(pageId);
    });
    opts.appendChild(btn);
  });
  return box;
}

function updateGate(pageId){
  const g=gradeable[pageId]; if(!g) return;
  const btn=document.getElementById("completeBtn"), note=document.getElementById("gateNote");
  if(!btn) return;
  const left=g.total-g.answered;
  btn.disabled=left>0;
  if(note) note.textContent = left>0 ? `${left} question${left>1?"s":""} left in this module`
    : (g.total?`${g.correct} of ${g.total} right first time`:"");
}

/* ======================= PAGES ======================= */
function renderModule(m){
  const main=document.getElementById("main"); main.innerHTML="";
  if(m.id==="start"){
    main.appendChild(el(`<header class="hero">
      <h1>${m.title}</h1><p>${m.lede}</p>
      <div class="meta"><div><b>${MODULES.length-1}</b>modules</div><div><b>${EXAM.length}</b>exam questions</div><div><b>80%</b>to pass</div></div></header>`));
  }else{
    main.appendChild(el(`<p class="eyebrow">${m.num}</p>`));
    main.appendChild(el(`<h2 class="mtitle">${m.title}</h2>`));
    main.appendChild(el(`<p class="lede">${m.lede}</p>`));
  }
  main.appendChild(renderBlocks(m.blocks,m.id));
  const isDone=state.done.includes(m.id);
  const row=el(`<div class="navrow"><button class="btn" id="completeBtn">${isDone?"Completed — continue":"Mark complete and continue"}</button><span class="gate" id="gateNote"></span></div>`);
  main.appendChild(row);
  row.querySelector("#completeBtn").addEventListener("click",()=>{
    const g=gradeable[m.id];
    if(g&&g.total) state.scores[m.id]={c:g.correct,t:g.total};
    if(!state.done.includes(m.id)) state.done.push(m.id);
    save(); buildNav(); updateProgress();
    const i=PAGES.indexOf(m.id); go(PAGES[Math.min(i+1,PAGES.length-1)]);
  });
  updateGate(m.id);
  main.focus(); window.scrollTo(0,0);
}

let examAnswers=[];
function renderExam(){
  const main=document.getElementById("main"); main.innerHTML="";
  main.appendChild(el(`<p class="eyebrow">Final exam</p>`));
  main.appendChild(el(`<h2 class="mtitle">${EXAM.length} questions, 80% to pass</h2>`));
  const left=MODULES.length-state.done.length;
  main.appendChild(el(`<p class="lede">${left>0?`You still have ${left} module${left>1?"s":""} to complete — you can take the exam anyway, but it will be harder than it needs to be.`:"All modules complete. Answer everything, then submit."}${state.best?` Your best score so far: ${state.best}%.`:""}</p>`));
  examAnswers=new Array(EXAM.length).fill(null);
  const form=document.createElement("div");
  EXAM.forEach((q,qi)=>{
    const box=el(`<div class="ex"><div class="kind">Question ${qi+1} of ${EXAM.length}</div><p class="q">${q.q}</p><div class="opts"></div><div class="why hidden"></div></div>`);
    const opts=box.querySelector(".opts");
    q.o.forEach((text,i)=>{
      const btn=el(`<button class="opt" type="button"></button>`); btn.textContent=text;
      btn.addEventListener("click",()=>{
        if(box.dataset.locked) return;
        examAnswers[qi]=i;
        [...opts.children].forEach(o=>o.classList.remove("picked"));
        btn.classList.add("picked");
        const sb=document.getElementById("submitExam"); if(sb) sb.disabled=examAnswers.includes(null);
      });
      opts.appendChild(btn);
    });
    form.appendChild(box);
  });
  main.appendChild(form);
  const row=el(`<div class="navrow"><button class="btn" id="submitExam" disabled>Submit exam</button><span class="gate">Answer all ${EXAM.length} questions to submit</span></div>`);
  main.appendChild(row);
  const result=el(`<div id="examResult"></div>`); main.appendChild(result);

  row.querySelector("#submitExam").addEventListener("click",()=>{
    let correct=0;
    [...form.children].forEach((box,qi)=>{
      box.dataset.locked="1";
      const q=EXAM[qi], opts=box.querySelectorAll(".opt"), why=box.querySelector(".why");
      opts.forEach((o,i)=>{o.disabled=true;o.classList.remove("picked");
        if(i===q.c)o.classList.add("right"); else if(i===examAnswers[qi])o.classList.add("wrong");});
      const ok=examAnswers[qi]===q.c; if(ok)correct++;
      why.className="why "+(ok?"ok":"no");
      why.innerHTML=`<b>${ok?"Correct.":"Not this one."}</b> ${q.w}`;
    });
    const pct=Math.round(correct/EXAM.length*100), passed=pct>=80;
    if(pct>state.best){state.best=pct; state.examDate=new Date().toISOString().slice(0,10);}
    save(); buildNav();
    result.innerHTML="";
    result.appendChild(el(`<div style="margin-top:34px"><div class="score">${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p>${correct} of ${EXAM.length} correct. ${passed?"That is a pass.":"You need 80%. Review the explanations above and retake it."}</p></div>`));
    result.appendChild(buildReportBox(pct,correct,passed));
    const retake=el(`<div class="navrow"><button class="btn ghost" id="retake">Retake the exam</button></div>`);
    retake.querySelector("#retake").addEventListener("click",()=>renderExam());
    result.appendChild(retake);
    result.scrollIntoView({behavior:"smooth",block:"start"});
  });
  main.focus(); window.scrollTo(0,0);
}

function reportPayload(pct,correct){
  return {
    name:state.name, email:state.email,
    date:new Date().toISOString(),
    modulesCompleted:state.done.filter(id=>id!=="start").length,
    modulesTotal:MODULES.length-1,
    moduleScores:Object.keys(state.scores).map(k=>`${k}:${state.scores[k].c}/${state.scores[k].t}`).join(", "),
    examScorePct:pct, examCorrect:correct, examTotal:EXAM.length,
    passed:pct>=80
  };
}

function buildReportBox(pct,correct,passed){
  const p=reportPayload(pct,correct);
  const text=`MANAGD onboarding result
Name: ${p.name}
Email: ${p.email||"—"}
Date: ${new Date().toLocaleString()}
Modules completed: ${p.modulesCompleted} of ${p.modulesTotal}
Module scores (first attempt): ${p.moduleScores||"—"}
Exam: ${p.examCorrect}/${p.examTotal} = ${p.examScorePct}% — ${p.passed?"PASS":"FAIL"}`;

  const box=el(`<div class="cert">
    <h3>${passed?"Onboarding complete":"Result recorded"}</h3>
    <p class="tiny" style="margin:0 0 14px">Send this to your manager. If automatic sending is switched off, copy the summary or email it.</p>
    <div class="navrow" style="margin-top:0;border:0;padding-top:0">
      <button class="btn" id="sendBtn">Send my results</button>
      <button class="btn ghost" id="copyBtn">Copy summary</button>
      ${CONFIG.managerEmail?`<a class="btn ghost" style="text-decoration:none;display:inline-block" href="mailto:${CONFIG.managerEmail}?subject=${encodeURIComponent("Onboarding result — "+p.name)}&body=${encodeURIComponent(text)}">Email it</a>`:""}
      <button class="btn ghost" id="printBtn">Print</button>
    </div>
    <p class="status" id="sendStatus"></p>
    <textarea readonly id="summaryBox">${text}</textarea>
  </div>`);

  box.querySelector("#copyBtn").addEventListener("click",()=>{
    const ta=box.querySelector("#summaryBox"); ta.select();
    try{document.execCommand("copy");}catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
    box.querySelector("#sendStatus").textContent="Summary copied.";
  });
  box.querySelector("#printBtn").addEventListener("click",()=>window.print());
  box.querySelector("#sendBtn").addEventListener("click",async()=>{
    const st=box.querySelector("#sendStatus"); st.textContent="Sending…";
    if(!CONFIG.reportUrl){
      st.textContent="Automatic sending isn't set up on this copy — use Copy summary or Email it instead.";
      return;
    }
    try{
      // Apps Script web apps don't return CORS headers, so the response
      // body can't be read from the browser — "no-cors" still delivers
      // the POST, we just can't confirm the read side of it here.
      await fetch(CONFIG.reportUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
      state.sent=true; save();
      st.textContent="Sent — it should appear in the team sheet in a few seconds.";
    }catch(e){
      st.textContent="Could not reach the results sheet — use Copy summary or Email it instead.";
    }
  });
  return box;
}

/* ======================= NAV ======================= */
function buildNav(){
  const list=document.getElementById("navList"); if(!list) return;
  list.innerHTML="";
  MODULES.forEach(m=>{
    const li=el(`<li class="${state.done.includes(m.id)?"done":""}"><button type="button"><span class="mk"></span>${m.nav}</button></li>`);
    li.querySelector("button").addEventListener("click",()=>go(m.id));
    if(m.id===current) li.querySelector("button").setAttribute("aria-current","true");
    list.appendChild(li);
  });
  const ex=el(`<li class="${state.best>=80?"done":""}"><button type="button"><span class="mk"></span>Final exam</button></li>`);
  ex.querySelector("button").addEventListener("click",()=>go("exam"));
  if(current==="exam") ex.querySelector("button").setAttribute("aria-current","true");
  list.appendChild(ex);
  if(CONFIG.sheetUrl){
    const d=el(`<li><a href="${CONFIG.sheetUrl}" target="_blank" rel="noopener" style="display:block;padding:9px 10px 9px 34px;color:var(--ink);font-size:14.5px;border-radius:8px;text-decoration:none;position:relative;font-family:'Bricolage Grotesque',sans-serif;font-weight:500"><span class="mk" style="position:absolute;left:8px;top:10px"></span>Team progress ↗</a></li>`);
    list.appendChild(d);
  }
}
function updateProgress(){
  const num=document.getElementById("progNum"); if(!num) return;
  const total=MODULES.length, done=state.done.length;
  num.textContent=`${done} of ${total}`;
  document.getElementById("ringFill").setAttribute("stroke-dashoffset", 2*Math.PI*15.5*(1-done/total));
}
function go(id){
  current=id;
  if(id==="exam") renderExam();
  else renderModule(MODULES.find(m=>m.id===id)||MODULES[0]);
  buildNav();
}

/* ======================= BOOT ======================= */
if(state.name) mountShell(); else askName(false);
</script>
</body>
</html>
