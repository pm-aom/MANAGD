<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANAGD — Tenant Coordinator Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  /* MANAGD brand: navy #0F1C4D, sky #7FCCFA */
  --navy:#0F1C4D; --sky:#7FCCFA;
  --paper:#F3F6FC; --card:#FFFFFF; --ink:#0F1C4D; --ink-soft:#586489;
  --rule:#DCE3F1; --teal:#0F1C4D; --teal-dim:#E7ECF8; --brass:#0A6FA8; --brass-dim:#E8F5FE;
  --bad:#A63A24; --bad-dim:#F7E6E1; --shadow:0 1px 0 rgba(15,28,77,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1230; --card:#131C42; --ink:#E9EEFA; --ink-soft:#9DA9CE;
    --rule:#26315C; --teal:#7FCCFA; --teal-dim:#1A2A57; --brass:#7FCCFA; --brass-dim:#16244D;
    --bad:#E08268; --bad-dim:#3A1E18; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1230; --card:#131C42; --ink:#E9EEFA; --ink-soft:#9DA9CE;
  --rule:#26315C; --teal:#7FCCFA; --teal-dim:#1A2A57; --brass:#7FCCFA; --brass-dim:#16244D;
  --bad:#E08268; --bad-dim:#3A1E18; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.62;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.ui{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:-.015em}
a{color:var(--teal)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--rule);background:var(--card);padding:26px 22px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:40px 6vw 96px;max-width:940px}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:18px 20px 22px}
  .main{padding:26px 20px 80px}
  body{font-size:16.5px}
}
.logo{display:block;width:150px;height:auto;margin:0 0 14px}
.logo.on-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.on-light{display:none} :root:not([data-theme="light"]) .logo.on-dark{display:block}}
:root[data-theme="dark"] .logo.on-light{display:none}
:root[data-theme="dark"] .logo.on-dark{display:block}
.brand{font-size:17px;line-height:1.25;margin:0}
.brand small{display:block;font-family:"Source Serif 4",serif;font-weight:400;font-size:13px;color:var(--ink-soft);letter-spacing:0;margin-top:5px}
.who{margin:16px 0 0;font-size:13px;color:var(--ink-soft);font-family:"Bricolage Grotesque",sans-serif}
.who b{color:var(--ink)}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0 18px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.ring{width:42px;height:42px;flex:none}
.prog-t{font-size:13.5px;line-height:1.35;color:var(--ink-soft);font-family:"Bricolage Grotesque",sans-serif;font-weight:500}
.prog-t b{display:block;color:var(--ink);font-size:15px}
nav ol{list-style:none;margin:0;padding:0}
nav button{width:100%;text-align:left;background:none;border:0;padding:9px 10px 9px 34px;color:var(--ink);font-size:14.5px;line-height:1.35;cursor:pointer;border-radius:8px;position:relative;font-family:"Bricolage Grotesque",sans-serif;font-weight:500}
nav button:hover{background:var(--paper)}
nav button[aria-current="true"]{background:var(--teal-dim)}
nav .mk{position:absolute;left:8px;top:10px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center}
nav .done .mk{background:var(--teal);border-color:var(--teal)}
nav button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--sky)}
nav .done .mk::after{content:"✓";font-size:11px;line-height:1;color:#fff}
.side-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);display:flex;gap:12px;flex-wrap:wrap}
.tiny{font-size:12.5px;color:var(--ink-soft);font-family:"Bricolage Grotesque",sans-serif}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:"Bricolage Grotesque",sans-serif}
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:34px;position:relative}
.hero::before{content:"";display:block;width:54px;height:4px;border-radius:2px;background:var(--sky);margin:0 0 18px}
.hero h1{font-size:clamp(32px,5.6vw,52px);line-height:1.03;margin:0 0 16px;max-width:16ch}
.hero p{font-size:19px;max-width:60ch;color:var(--ink-soft);margin:0 0 22px}
.hero .meta{display:flex;gap:26px;flex-wrap:wrap;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;color:var(--ink-soft)}
.hero .meta b{display:block;color:var(--ink);font-size:24px;font-weight:700;line-height:1.1}
.eyebrow{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;color:var(--brass);font-weight:600;margin:0 0 8px}
h2.mtitle{font-size:clamp(26px,4.2vw,37px);line-height:1.1;margin:0 0 10px;max-width:21ch}
.lede{font-size:18.5px;color:var(--ink-soft);margin:0 0 30px;max-width:62ch}
.main p,.main li{max-width:70ch}
h3{font-size:21px;margin:34px 0 10px}
.main ul{padding-left:20px}
.main li{margin:6px 0}
.callout{border-left:3px solid var(--sky);background:var(--brass-dim);padding:14px 18px;border-radius:0 8px 8px 0;margin:22px 0;font-size:16.5px;max-width:70ch}
.callout b{font-family:"Bricolage Grotesque",sans-serif}
.tablewrap{overflow-x:auto;margin:20px 0;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;color:var(--ink-soft);font-weight:600;background:var(--paper)}
tr:last-child td{border-bottom:0}
td.yes{color:var(--teal);font-weight:600}
td.no{color:var(--ink-soft)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.flow div{flex:1 1 130px;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:12px 14px;font-family:"Bricolage Grotesque",sans-serif;font-size:14px;line-height:1.3}
.flow span{display:block;color:var(--brass);font-size:12px;margin-bottom:5px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:22px 0}
.flip{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;cursor:pointer;text-align:left;min-height:106px;box-shadow:var(--shadow);display:flex;align-items:center;font-size:15px;line-height:1.4;color:var(--ink)}
.flip:hover{border-color:var(--teal)}
.flip .b{color:var(--teal);font-weight:600;font-family:"Bricolage Grotesque",sans-serif}
.ex{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 20px 16px;margin:26px 0;box-shadow:var(--shadow)}
.ex .kind{font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;color:var(--brass);font-weight:600;margin-bottom:8px}
.ex .q{font-size:17.5px;margin:0 0 14px;font-weight:600;font-family:"Bricolage Grotesque",sans-serif;line-height:1.35}
.msg{background:var(--paper);border-radius:10px;padding:13px 15px;margin:0 0 16px;font-style:italic;border:1px solid var(--rule)}
.msg b{display:block;font-style:normal;font-family:"Bricolage Grotesque",sans-serif;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:11px 14px;cursor:pointer;font-size:15.8px;line-height:1.45;color:var(--ink);font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--teal);background:var(--teal-dim)}
.opt.wrong{border-color:var(--bad);background:var(--bad-dim)}
.opt.picked{border-color:var(--teal);background:var(--teal-dim)}
.why{margin-top:13px;font-size:15.5px;padding:12px 14px;border-radius:9px;line-height:1.5}
.why.ok{background:var(--teal-dim)} .why.no{background:var(--bad-dim)}
.why b{font-family:"Bricolage Grotesque",sans-serif}
.btn{background:var(--teal);color:#fff;border:0;padding:12px 22px;border-radius:9px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:"Bricolage Grotesque",sans-serif}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule)}
.gate{font-size:14px;color:var(--ink-soft);font-family:"Bricolage Grotesque",sans-serif}
.score{font-size:60px;line-height:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:14px 0 6px;max-width:420px}
.bar i{display:block;height:100%;background:var(--sky)}
.cert{border:2px solid var(--sky);border-radius:14px;padding:28px;margin:26px 0;background:var(--card);max-width:620px}
.cert h3{margin:0 0 6px;font-size:24px}
input[type=text],input[type=email],textarea{font-family:inherit;font-size:16px;padding:10px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);width:min(340px,100%)}
textarea{width:100%;min-height:150px;font-size:13.5px;line-height:1.5}
.gate-screen{max-width:520px;margin:8vh auto;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:32px}
.field{margin:16px 0}
.field label{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.hidden{display:none}
.status{font-size:14px;font-family:"Bricolage Grotesque",sans-serif;color:var(--ink-soft);margin-top:10px}
@media print{.side{display:none}.shell{display:block}.navrow,.btn{display:none}}
</style>
</head>

<script>
const CONFIG = {
  reportUrl: "https://script.google.com/macros/s/AKfycbyyB-XmptQGYuZd6qKraB-HFRq6AjitXYnWI5GEkW4xuGAfO54d36VI1dL8bg4XTKvE/exec",
  sheetUrl: "https://docs.google.com/spreadsheets/d/1219ANmyH53w5v7ru0CHCnvnV3H-KydnUyyDnh2fgMSo/edit?usp=sharing",
  managerEmail: ""

<div id="app"></div>

<script>
/* ======================= CONTENT ======================= */
const MODULES = [
{
 id:"start", nav:"Start here", num:"", title:"You are the person the tenant actually talks to",
 lede:"Owners are abroad. Building management is behind a ticket system. For a tenant, you are the company — so the accuracy of your answers is the product.",
 blocks:[
  {t:"p",v:"This course is built for tenant coordinators. Most of what you will do every day is answer a tenant: about a repair, a bill, a cooling charge, a deposit, a renewal. Around that sits the structure you need to know in order to answer correctly — who the three companies are, what the owner bought, and where our authority stops."},
  {t:"h",v:"How it works"},
  {t:"list",v:[
    "Thirteen modules. Read, then answer the questions inside each one.",
    "Most questions are real tenant or owner messages. You choose how you would reply.",
    "A module cannot be marked complete until every question in it has been answered. Getting one wrong is useful — the explanation is the point.",
    "Final exam: 27 questions, 80% to pass, retakeable. When you finish, send your result to your manager with the button at the end."
  ]},
  {t:"callout",v:"<b>The one habit to build on day one.</b> If a tenant asks something you are not sure about, the right answer is “let me confirm and come back to you today”. Never improvise. A delayed answer costs nothing. A confident wrong answer costs a client."}
 ]
},

{
 id:"m_role", nav:"1 · Your role", num:"Module 1", title:"What a Tenant Coordinator actually owns",
 lede:"Straight from your job description. This is the shape of the job before any process detail — what you're responsible for, who you work with, and how you'll be measured.",
 blocks:[
  {t:"p",v:"The Tenant Coordinator is the central point of contact between tenants, landlords, building management and service providers, across the whole tenancy lifecycle. The job is coordination, communication and operational support — keeping service standards and tenant satisfaction high, not just processing paperwork."},
  {t:"h",v:"What you own"},
  {t:"list",v:[
    "Being the tenant's primary point of contact — handling inquiries, requests and concerns promptly and professionally, and proactively solving them within Managd's established processes, not just relaying them upward.",
    "Coordinating handovers, move-ins, move-outs and lease renewals for your assigned portfolio, start to finish.",
    "Managing tenant requests about maintenance, services and building operations — coordination, follow-up and resolution.",
    "Supporting lease administration: documentation tracking, and coordination with internal teams, particularly Finance.",
    "Ensuring compliance with building regulations, SLAs and the tenancy contracts actually in place.",
    "Coordinating and following up on snagging and de-snagging documentation to timely closure, and overseeing deep cleaning after handover.",
    "Providing leave coverage with structured handovers, so your portfolio keeps running when a colleague is out — and so yours does when you are.",
    "Providing administrative support for the investment handover process."
  ]},
  {t:"h",v:"Beyond day-to-day tickets"},
  {t:"p",v:"The role also includes process improvement — noticing gaps or recurring issues in tenant operations, proposing practical fixes with Line Management, helping document and standardise processes, and helping put agreed changes into daily practice — and data integrity: accurate, timely entry in the Managd platform, and feedback that helps improve the platform itself. You may also take on leasing activities end-to-end for your portfolio where required, and support Leadership on operational projects."},
  {t:"h",v:"Who you work with"},
  {t:"p",v:"You report to the Tenant Coordinator Lead. Your regular interfaces are the Team Lead Operations, Managd Lease Agents, Investor Relations, the Chief of Staff, Finance, tenants, and external service providers. The Finance link matters daily: cheque collection, rent processing and fee payments run through that relationship."},
  {t:"h",v:"Communication and records"},
  {t:"p",v:"You are the communication link between tenants, internal teams and external service providers, and the information you pass on must be timely, accurate and consistent. All tenant communications are documented and aligned with Managd's communication standards and processes; you maintain and update tenant communication channels where required, and you follow up on action items from meetings so responsibilities are clear and things actually get done. Data, reports and records are filed according to the SOPs and workflows."},
  {t:"p",v:"Among the key competencies the job description lists: the ability to follow processes and to escalate risks or deviations appropriately, a high level of accuracy in data entry and record management, and excellent spoken and written English."},
  {t:"h",v:"How the role is actually measured"},
  {t:"list",v:[
    "Timely execution of move-ins, move-outs and renewals, in line with process workflows.",
    "Adherence to approved processes and timelines — not improvised shortcuts, even fast ones.",
    "Data accuracy and completeness in the platform.",
    "Response times to tenants and internal stakeholders.",
    "Timely completion of assigned project tasks.",
    "Volume of successfully completed leasing transactions, where leasing is part of your remit."
  ]},
  {t:"callout",v:"<b>Two things the job description states directly, and that shape everything after this module.</b> First, you are expected to act “independently and proactively” within established processes — the goal is not to escalate everything, it's to resolve what the process already covers. Second, response times are measured — but so are adherence to approved processes and data accuracy. Speed does not replace either."},
  {t:"quiz",v:{q:"A tenant's request falls squarely within an established Managd process you already know well.",
   o:["Resolve it within the process and document it","Resolve it, then have your Team Lead sign it off before you confirm to the tenant","Escalate it to your Team Lead, since tenant-facing answers need a second check","Resolve it verbally — documentation is only needed when something is escalated"],
   c:0,w:"The role is explicitly defined around independent, proactive resolution within established processes — escalating routine, in-scope requests defeats the purpose of the role."}},
  {t:"quiz",v:{q:"Which of these is explicitly one of the performance measures for this role?",
   o:["Data accuracy and completeness","Tenant satisfaction scores","Number of renewals signed at a higher rent","Number of maintenance requests closed per week"],
   c:0,w:"Data accuracy and completeness is named directly, alongside timely execution of move-ins/move-outs/renewals, adherence to process and timelines, response times, project task completion, and leasing volume where applicable."}},
  {t:"quiz",v:{q:"A tenant asks for something no Managd process covers, and saying yes would mean departing from the signed contract.",
   o:["Tell the tenant you'll check, and escalate it as a deviation","Agree, provided the tenant confirms the request in writing so it is documented","Agree if the owner has no objection on a quick call, and note it in the platform","Decline — anything outside the signed contract is never possible"],
   c:0,w:"Independent resolution applies within established processes. Outside them, the job description asks you to escalate risks or deviations appropriately — not to improvise."}},
  {t:"quiz",v:{q:"On a phone call you agreed with a tenant that the AC technician will come on Thursday.",
   o:["Document the agreement per Managd's standards and update the platform","Send the tenant a WhatsApp confirmation — the chat history counts as the record","Note it in your own calendar so you can follow up with the technician on Thursday","Update the platform once the technician has attended, to avoid double entries"],
   c:0,w:"All tenant communications are documented, and the platform must be accurate and up to date — undocumented agreements are exactly what breaks during leave coverage."}}
 ]
},

{
 id:"m1", nav:"2 · Who does what", num:"Module 2", title:"Three companies behind one inbox",
 lede:"A tenant writes to one place. Behind it are three legal entities with strictly separated jobs. Knowing the split is what stops you promising something that is not yours to give.",
 blocks:[
  {t:"h",v:"MANAGD Property Management L.L.C. — operations, and your job"},
  {t:"p",v:"Handover coordination with the developer, DEWA and Empower registration, organising and following up snagging and de-snagging including its own walkthrough of every unit, and letting clearance. Then the part you live in: preparation of the show floor, viewings, tenant screening and credit checks, the tenancy contract and Ejari registration, and the photo handover protocol at move-in."},
  {t:"p",v:"During the tenancy Managd is the on-site contact for tenants, coordinates maintenance and emergencies, walks vacant units weekly, handles renewals, runs the first stage of collection on payment default, and does the move-out pre-inspection and deposit settlement."},
  {t:"h",v:"DGMA Legal Consultancy FZ-LLC — legal, and all money"},
  {t:"p",v:"Investor KYC and onboarding, preparation and notarisation of the Power of Attorney, legal representation towards developer and authorities, and legal representation of the owner when the tenancy contract is concluded. DGMA is the only party authorised under the Power of Attorney to receive rent or deposits. Cheques are issued to DGMA and the owner is paid out 10 to 14 days after clearing."},
  {t:"h",v:"DG Homes Real Estate Broker L.L.C. — marketing"},
  {t:"p",v:"Listings per apartment type on all portals — Property Finder, Bayut and others — cooperation with brokerage firms, and tenant acquisition. DG Homes also monitors the market together with Managd using the RERA index and rent levels, and re-markets the unit after a move-out."},
  {t:"h",v:"Deliberately not ours"},
  {t:"p",v:"Common areas, pool, outdoor facilities and the collection of the service charges lie with the building management company. Amount and use of the service charges are decided by the building management company and the owners association; Managd, DGMA and DG Homes have no influence on them. Defects in common areas we forward as a courtesy — without contractual obligation and without follow-up. Maintenance of the air conditioning inside the unit is the owner's responsibility, with coordination by Managd on request."},
  {t:"cards",v:[
    {f:"Who registers the unit's DEWA account?",b:"Managd, in the owner's name, under the PoA"},
    {f:"Who may receive rent or a deposit?",b:"DGMA Legal only"},
    {f:"Who re-markets a unit after move-out?",b:"DG Homes"},
    {f:"Who fixes the lobby lift?",b:"Building management. We forward it as a courtesy, no follow-up"}
  ]},
  {t:"scenario",v:{from:"Tenant, WhatsApp, Saturday morning",msg:"The gym on the podium has been closed for two weeks and nobody answers. Can you sort it out? I pay rent, I should be able to use it.",
   o:["Common areas are the building management's — you'll pass the report on, but follow-up sits with them","Pass it to the building management and promise the tenant you will chase them until the gym reopens","Log a maintenance job — use of shared facilities is part of what the tenant pays rent for","Refer the tenant to the developer, as the building is still within its Defect Liability Period"],
   c:0,w:"Common areas sit with the building management company. We forward reports as a courtesy — but without obligation and without follow-up, so do not promise to chase it. Saying it plainly is better than going quiet."}},
  {t:"quiz",v:{q:"A tenant wants to hand you cash for the next rent instalment because their cheque bounced.",
   o:["Decline — only DGMA may receive funds; arrange payment via DGMA and escalate","Accept it against a signed Managd receipt and hand it to DGMA the same day, so nothing is lost","Decline the cash, but accept a bank transfer into Managd's account instead","Accept it — Managd is named in the PoA as the owner's representative"],
   c:0,w:"This is the hardest line in the job because the tenant is trying to solve the problem. Managd is named in the PoA but is not permitted to receive funds. Never take money."}}
 ]
},
{
 id:"m2", nav:"3 · Our authority", num:"Module 3", title:"What the Power of Attorney lets us do",
 lede:"Everything we do for an owner rests on one notarised document. You need both halves: what it covers, and what it explicitly excludes.",
 blocks:[
  {t:"p",v:"The Power of Attorney allows the authorised representatives to act on the owner's behalf in relation to their real estate assets in the UAE. It includes letting properties, collecting rent, negotiating and terminating tenancy contracts, and representation before authorities and service providers."},
  {t:"p",v:"It names several companies and individuals who may act jointly or individually: DGMA Legal Consultancy FZ-LLC, D G Homes Real Estate Broker L.L.C., MANAGD Property Management L.L.C., and individually named persons employed by these companies."},
  {t:"list",v:[
    "Conclusion, amendment and termination of tenancy contracts.",
    "Management of the property, including maintenance and communication with tenants.",
    "Representation before authorities: Dubai Land Department, RERA, DEWA, and before courts and arbitration bodies.",
    "Receipt of rent, deposits or other payments — DGMA Legal only."
  ]},
  {t:"callout",v:"<b>Named in the PoA ≠ allowed to handle money.</b> Managd and DG Homes are both named representatives, and neither may receive funds. No other company or individual named in the PoA is authorised to do so."},
  {t:"h",v:"Limits and duties"},
  {t:"p",v:"The PoA does not authorise the purchase, sale or transfer of properties, and the representative may not enter into agreements going beyond the powers set out in it. The representative is obliged to act in the owner's interest and to properly maintain all relevant financial and legal documents; misuse or breach of duty may result in criminal consequences."},
  {t:"p",v:"It takes effect on notarisation and remains valid until revoked, and revocation must be carried out officially and lodged with the notary and the relevant authorities. Notarisation happens with a local UAE notary on the basis of a video recording provided by the investor, after digital onboarding through the Managd portal is complete and the DGMA and Managd invoices are settled. The investor needs a passport valid for at least 6 months (a national ID card is not sufficient), and the video is recorded in English; investors without an Emirates ID confirm the PoA in a video call with the notary instead. Preparation usually takes 5 to 7 working days. The PoA remains valid until it is expressly revoked, unless a specific validity period is noted in the document; revocation is possible at any time, also digitally, but in person via video call."},
  {t:"quiz",v:{q:"An owner abroad asks whether we can sell the unit for them under the PoA.",
   o:["No — the PoA does not cover sale or transfer","Yes — the PoA covers representation before the Dubai Land Department","Only through DGMA, as the legal representative under the PoA","Yes, provided the unit is vacant at the time of the sale"],
   c:0,w:"An explicit limitation. The PoA covers letting and management, not disposal of the asset."}},
  {t:"quiz",v:{q:"When does the PoA stop being valid?",
   o:["When officially revoked — unless it names a validity period","When the management agreement ends","After the one-year minimum term, unless it is renewed","When the owner sends Managd a signed revocation letter by email"],
   c:0,w:"Effective on notarisation, valid until formally revoked (unless the document itself names a validity period). Revocation is an official act, not an email."}}
 ]
},
{
 id:"m3", nav:"4 · Basic or Premium", num:"Module 4", title:"What the owner bought — and why it reaches the tenant",
 lede:"The package decides what you may promise. It also decides who pays the service charge invoice and how far legal support goes when a tenant stops paying.",
 blocks:[
  {t:"p",v:"The rental management agreement governs the relationship between owner and property manager: services, responsibilities and financial obligations, so that the property is managed while the owner is not in Dubai."},
  {t:"table",v:{head:["Service","Basic","Premium"],rows:[
    ["Handover service: key handover, snagging &amp; de-snagging, DEWA and Empower registration, deep cleaning","✓","✓"],
    ["Tenant management: tenant search, credit checks, contract conclusion and renewals","✓","✓"],
    ["Rent administration: collection of rent payments, administration of security deposits","✓","✓"],
    ["Maintenance coordination: organisation of maintenance and repair works","✓","✓"],
    ["Authority liaison: Ejari registration, RERA, Dubai Land Department","✓","✓"],
    ["Service charges paid out of the rental income (under Basic the owner pays directly)","—","✓"],
    ["Legal representation on tenant default: out-of-court collection and support in RDC execution proceedings","—","✓"],
    ["Third-party liability management: steering of subcontractor and maintenance agreements","—","✓"],
    ["Management fee (minimum AED 3,500 plus 5% VAT)","5%","7%"]
  ]}},
  {t:"callout",v:"<b>Premium is not unlimited legal cover.</b> Representation in RDC court proceedings, first and second instance, is commissioned separately, as are court fees. In execution proceedings the owner additionally bears translation and out-of-pocket expenses of approximately AED 400."},
  {t:"h",v:"Term, termination, owner obligations"},
  {t:"p",v:"Two years with automatic renewal; termination is possible only after the minimum term of one year, in writing with 60 days notice. Extraordinary termination is possible if the manager breaches its duties, and on termination all documents, tenant information and outstanding payments are handed over to the owner. The owner provides proof of ownership, bank details and proof of identity, grants the PoA, pays the management fees punctually, and ensures funds are available for necessary repairs."},
  {t:"quiz",v:{q:"Eight months in, an owner wants to terminate the agreement.",
   o:["Not yet — first the one-year minimum, then in writing with 60 days' notice","Yes — in writing, with 60 days' notice, like any termination under the agreement","Yes — with 90 days' notice, in line with the tenancy notice rules","Only at the end of the second year, with 60 days' notice"],
   c:0,w:"Unless the manager has breached its duties, which allows extraordinary termination, the one-year minimum applies first."}},
  {t:"quiz",v:{q:"A Basic-package owner asks why the service charge invoice came to them directly.",
   o:["Under Basic the owner pays service charges directly; paying them from rent is Premium","It was a mistake — under both packages service charges are deducted from the rent","Under Basic, service charges come out of rent only once a tenant is in place","Under Basic, Managd pays them and re-invoices the owner once a quarter"],
   c:0,w:"One of the most frequent Basic-versus-Premium questions. If the owner wants it handled, the route is an upgrade."}}
 ]
},
{
 id:"m4", nav:"5 · Handover & snagging", num:"Module 5", title:"How a unit becomes lettable",
 lede:"You will inherit units from this phase and answer tenant questions about defects that came out of it. You need the shape of it and the honest expectations it sets.",
 blocks:[
  {t:"flow",v:[["1","Snagging"],["2","Report to the developer"],["3","De-snagging"],["4","Check by our team"],["5","Letting clearance"]]},
  {t:"p",v:"Snagging is the systematic inspection of a newly built property for structural and technical defects before official handover — structural incompletions, faulty installations, cosmetic damage. De-snagging is the follow-up check after the developer reports rectification. The report is also the basis on which claims are asserted against the developer."},
  {t:"list",v:[
    "A professional, independent snagging company inspects every apartment individually. Cost: AED 1.8 per sqft including VAT, a third-party service passed on to the owner; organisation and follow-up are included in both packages.",
    "The report goes to the developer, who must rectify within an agreed period.",
    "The snagging company verifies the rectification — usually 1 to 2 weeks.",
    "Our property management team then walks through every single apartment itself; anything still open is reported again and followed up until the end of the Defect Liability Period.",
    "After that check the team issues the letting clearance. At move-in, a detailed photo handover protocol is created with the tenant."
  ]},
  {t:"h",v:"What realistically gets fixed"},
  {t:"table",v:{head:["Type of snag","Examples","Rectified by the developer?"],rows:[
    ["Functional and technical defects","Installations, plumbing, electrics, doors and windows, sealing, leaks","Yes — enforced consistently; these affect the substance and usability of the apartment"],
    ["Clearly visible cosmetic defects","Damaged tiles, faulty surfaces that stand out at first glance","As a rule, yes"],
    ["Minor cosmetic snags","Fine scratches, minimal paint or grouting inaccuracies, traces of use — visible only on close inspection","Realistically not; considered customary in construction practice, but they remain documented in the report"]
  ]}},
  {t:"p",v:"No snagging report is ever completely “defect-free” — this is normal for new builds and affects neither lettability nor value. Snagging deliberately happens before the deep cleaning, because many items that look cosmetic (dust, stains, film on surfaces) disappear with professional cleaning. Owners can view and download both the snagging and de-snagging reports in the investor portal. The Defect Liability Period is usually one year after handover."},
  {t:"h",v:"Why handover can stall"},
  {t:"p",v:"Almost all developers require proof, before handing over the keys, that a DEWA account has been activated in the owner's name — the developer does not want to remain liable for the unit's consumption after handover. Registration takes 3 to 5 working days and the deposit must be paid locally, so a late start delays the whole handover."},
  {t:"scenario",v:{from:"New tenant, day two in the apartment",msg:"There are fine scratches on the wardrobe doors and the grouting in the second bathroom is uneven. This is a brand new building. Can you have the developer redo it?",
   o:["Minor cosmetic items stay documented but are realistically not rectified; functional issues you take up at once","Raise every item with the developer — the building is still within the Defect Liability Period, so all defects are covered","Explain that nothing can be raised any more, because the snagging report was closed at handover","Have a contractor fix it and bill the owner, as it is a defect that existed before move-in"],
   c:0,w:"Separate the categories out loud, every time. Functional items get chased; minor cosmetic ones stay documented. And check the photo handover protocol — it also protects the tenant from being charged for this at move-out."}}
 ]
},
{
 id:"m5", nav:"6 · Move-in", num:"Module 6", title:"Move-in: Ejari, accounts, and the photo protocol",
 lede:"Everything that goes wrong at move-out was either done or not done before and on move-in day.",
 blocks:[
  {t:"h",v:"The sequence"},
  {t:"flow",v:[["1","Tenancy contract concluded, DGMA representing the owner"],["2","Ejari registration"],["3","Tenant connects their own DEWA — and Empower, if the building is connected"],["4","Tenant sends Managd all connection documents — BEFORE move-in"],["5","Deep cleaning of the unit"],["6","Move-in day: unit is clean, Move-In Condition Report / photo protocol signed, keys"]]},
  {t:"callout",v:"<b>Managd rule: the tenant's DEWA is connected before move-in.</b> Only once it is connected is the deep cleaning scheduled, so that on move-in day the unit is already clean. All connection documents — DEWA, and Empower where the building is connected — must reach Managd before move-in."},
  {t:"p",v:"The tenant opens their own DEWA account (and Empower, where the building is connected). This requires the Ejari registration first — so a delayed Ejari delays the connection, the cleaning and the move-in date."},
  {t:"p",v:"Before any of this, tenants are vetted: residence visa, permanent employment and a salary certificate, plus the security deposit. Owners may propose their own prospective tenants, but vetting is always done by the management."},
  {t:"callout",v:"<b>There is no transfer of accounts.</b> The owner's DEWA account is not transferred to the tenant. It stays active permanently so the unit is supplied during vacancy — viewings, the weekly walkthrough, and protecting the unit, for example running the AC against moisture and mould. For a new tenancy, however, the rule is fixed: the tenant's DEWA must be connected before move-in — only then do we carry out the deep cleaning."},
  {t:"h",v:"The photo handover protocol"},
  {t:"p",v:"At move-in a detailed photo handover protocol is created with the tenant. At move-out the pre-inspection is carried out with the tenant against that protocol, and the deposit is settled on its basis. A protocol done carelessly at move-in becomes a dispute you cannot win later."},
  {t:"p",v:"In the tenancy contract Addendum this document is called the <b>Move-In Condition Report</b>. Managd conducts the inspection jointly with the tenant on or before the move-in date; the tenant reviews it, annotates where necessary and signs it at the inspection, before taking the keys. By signing, the tenant unconditionally accepts the condition as documented, and no amendments or additions are accepted after the keys have been handed over. At move-out it is the sole reference: no claim of pre-existing damage is accepted unless it is documented in the signed report. Any pre-move-in works that were agreed must be recorded in a separate written addendum signed by both parties before the move-in date."},
  {t:"h",v:"What the signed contract requires before and at move-in"},
  {t:"list",v:[
    "The tenancy is activated and keys are released only once all cheques — every postdated rental cheque and the security deposit cheque — have been handed over to Managd, and all other applicable fees are paid.",
    "At signing the tenant provides copies of a valid Emirates ID and passport for every occupant aged 18 and above, and a signed declaration of whether a pet will be kept.",
    "The tenant hands over the postdated rental cheques, payable to DGMA Legal Consultancy FZ-LLC, and the security deposit cheque.",
    "If Ejari is not provided by the lease start date, a penalty of AED 500 is payable to Managd, once per lease year."
  ]},
  {t:"p",v:"The security deposit is 5% of the annual rent, plus an additional 5% if a pet has been approved in writing. It is settled only at move-out."},
  {t:"cards",v:[
    {f:"What must exist before the tenant can open DEWA and Empower accounts?",b:"Ejari registration of the tenancy contract"},
    {f:"Security deposit",b:"5% of the annual rent (+5% with an approved pet) — settled only at move-out"},
    {f:"When must the tenant's DEWA (and Empower, if connected) be active and documented to Managd?",b:"Before move-in — so the deep cleaning can be done and the unit is clean on move-in day"},
    {f:"What comes right after the tenant's DEWA connection?",b:"Deep cleaning of the unit"},
    {f:"What is the deposit settled against?",b:"The photo handover protocol created at move-in"},
    {f:"Who holds the rent cheques?",b:"Cheques are issued to DGMA Legal; Managd administers them operationally"}
  ]},
  {t:"scenario",v:{from:"Tenant, move-in day",msg:"DEWA is asking for Ejari and I don't have it yet. Can I just use the owner's account for the first month and settle it later?",
   o:["No — they need their own account, which needs Ejari; escalate the Ejari, and if necessary the move-in date moves","Yes, but for one month at most — the consumption is then billed back to the tenant once their own account is open","Yes, if the owner agrees to it in writing beforehand","Let them move in and register DEWA within 7 days, once the Ejari arrives"],
   c:0,w:"There is no transfer and no informal sharing. And this should never surface on move-in day: the tenant's DEWA has to be connected and documented before move-in. What you can influence is the Ejari registration, so escalate it internally — and if the connection cannot be done in time, the move-in date is what moves, not the rule."}},
  {t:"scenario",v:{from:"New tenant, one week before move-in",msg:"I'll set up DEWA after I move in, it's easier once I'm there. Can we just keep the move-in date?",
   o:["No — DEWA (and Empower, if connected) must be active and documented before move-in; cleaning comes after that","Fine, as long as the DEWA documents reach us within the first week, so the records are complete before the first bill","Fine, as long as they send us the Ejari before move-in","Book the cleaning now so the date holds, and collect the DEWA documents afterwards"],
   c:0,w:"The order is fixed: tenant's DEWA connected → documents to Managd → deep cleaning → move-in."}},
  {t:"quiz",v:{q:"A colleague did the move-in while you were away and took no photos. What is the consequence?",
   o:["Nothing to compare against at move-out — charging or clearing becomes one word against another","None — the signed tenancy contract already records the condition of the unit at the start of the lease","The snagging report can simply be used as the move-in reference instead","The tenant's deposit is then refunded in full automatically"],
   c:0,w:"The pre-inspection at move-out is done against the photo handover protocol. The snagging report documents the developer's defects, not the condition handed to this tenant — and the tenancy contract does not describe the unit's condition. Without the protocol there is no basis for either charging or clearing the tenant."}},
  {t:"quiz",v:{q:"Ten days after getting the keys, a tenant emails photos of a chipped kitchen tile and asks you to add it to the Move-In Condition Report.",
   o:["Decline — no amendments once the keys are handed over","Add it, since it was reported within the first 14 days","Add it once the owner confirms","Leave the signed report unchanged, but attach the photos to it as an annex"],
   c:0,w:"The report is annotated and signed at the inspection, before the keys. That is why the joint inspection has to be done carefully — it cannot be reopened later."}},
  {t:"scenario",v:{from:"New tenant, two days before move-in",msg:"You have my deposit cheque and two of the four rent cheques. I'll bring the other two after I move in. Can I pick up the keys tomorrow so the movers can start?",
   o:["Not yet — keys only once all cheques are handed over and the fees are paid","Yes — the deposit cheque, which is what protects the owner, is already with us","Yes, if the remaining two cheques are handed over within 7 days of move-in","Yes, if the owner confirms it by phone"],
   c:0,w:"Part of the cheques is not enough. Activation of the tenancy and the key release depend on all cheques being handed over."}}
 ]
},
{
 id:"m6", nav:"7 · DEWA & Empower", num:"Module 7", title:"Electricity, water, cooling — the biggest source of tenant questions",
 lede:"This module produces more wrong answers from new colleagues than the rest of the course combined. Read it twice.",
 blocks:[
  {t:"h",v:"Who is who"},
  {t:"p",v:"DEWA, the Dubai Electricity and Water Authority, is the government provider for electricity and water; every unit requires its own DEWA account. Empower provides cooling — in many Dubai buildings air conditioning runs on district cooling, with chilled water delivered to the building, billed through a separate account per unit. Both providers are independent of Managd, DGMA Legal and the building management. We handle registration and coordination; the contracting party is always the owner, or later the tenant."},
  {t:"h",v:"The tenant's connection comes before move-in"},
  {t:"p",v:"For every new tenancy: the tenant's DEWA must be connected before move-in, and all connection documents — DEWA, and Empower where the building is connected — must be sent to Managd before move-in. The deep cleaning is scheduled only once DEWA is connected, so the unit is clean on move-in day. This is the most important utility rule in your daily work; the rest of this module explains the background."},
  {t:"h",v:"Before the building is connected to Empower"},
  {t:"p",v:"An Empower account for a unit can only be set up once the building itself is connected to the district cooling network. New buildings frequently are not connected at handover. The apartment is still cooled — the supply runs centrally through the building and is billed through the service charges."},
  {t:"p",v:"So that no high outstanding balance arises on the tenant's side during the tenancy, we bill the tenant a flat quarterly fee in advance for cooling, collect it, and transfer it to the owner together with the rent. Once the connection is made, the owners' accounts are registered and the tenant must register with Empower themselves; we inform the owner as soon as that is the case."},
  {t:"table",v:{head:["","Building not yet connected","Building connected"],rows:[
    ["Requirement for handover","DEWA proof only; Empower registration is technically not possible","DEWA and Empower proof; Managd registers both accounts in the owner's name"],
    ["How cooling is billed","Centrally through the building, via the service charges, plus a quarterly flat charge collected from the tenant in advance and paid out with the rent","Directly by Empower on the tenant's own account"],
    ["What the tenant must do","Pay the quarterly flat charge","Register with Empower themselves"]
  ]}},
  {t:"h",v:"When the tenant does not pay or does not register"},
  {t:"p",v:"Non-payment leads to disconnection, restored at the tenant's own expense — AED 2,000 plus outstanding amounts. At move-out the tenant settles all outstanding amounts first on the final bill; only then can the accounts be closed. Invoices from the tenancy period are never taken over by the owner — not even to bridge a gap."},
  {t:"cards",v:[
    {f:"DEWA emergency, electricity and water",b:"991"},
    {f:"DEWA customer care, 24/7",b:"04 601 9999, also WhatsApp · customercare@dewa.gov.ae · DEWA Smart App"},
    {f:"Empower customer care",b:"04 559 2888 · billing@empower.ae · head office 04 375 5555 · e-services.empower.ae"},
    {f:"DEWA activation time",b:"3 to 5 working days; deposit paid locally"},
    {f:"DEWA registration and deposit",b:"AED 2,155 for apartments; AED 2,000–4,000 by property type"},
    {f:"Empower registration and deposit",b:"Usually AED 2,000 for apartments; AED 1,000–2,000 by property type"}
  ]},
  {t:"scenario",v:{from:"Tenant, quarter two",msg:"Why am I paying you a cooling charge every quarter when I have no Empower account and no Empower bill? Is this your fee?",
   o:["The building isn't connected to Empower yet, so cooling is billed centrally via service charges; the quarterly advance prevents a large balance","It is Managd's administration fee for arranging cooling while there is no individual Empower account; it stops once the tenant's own account is opened","It is a refundable cooling deposit, returned to the tenant once the Empower account is opened","It is a temporary charge that the owner could choose to waive"],
   c:0,w:"The tenant is not being overcharged and it is not our fee — it is collected and transferred to the owner with the rent. Say why it exists, and that it changes once the building is connected."}},
  {t:"scenario",v:{from:"Owner, forwarding an invoice",msg:"An Empower bill arrived covering a period when the tenant was living there. Shall I just pay it and we deduct it later?",
   o:["No — invoices from the tenancy period are never taken over by the owner; we pursue the tenant","Pay it to avoid a disconnection, and we deduct it from the deposit at move-out","Pay it only if the amount is under AED 500","Pay it now, and we recover it from the tenant's next rent cheque"],
   c:0,w:"Paying once establishes the precedent, and recovering it afterwards is much harder than never paying it."}},
  {t:"quiz",v:{q:"A tenant is moving into a building that is connected to Empower. Which documents must reach Managd, and when?",
   o:["DEWA and Empower documents, before move-in","DEWA documents before move-in, Empower within the first week","DEWA and Empower documents, at the move-in inspection","DEWA only — Empower stays on the owner's account during the tenancy"],
   c:0,w:"In a connected building the tenant opens both accounts, and both sets of documents come to us before move-in. In a building not yet connected, only DEWA applies and cooling runs via the quarterly flat charge."}},
  {t:"quiz",v:{q:"The building has just been connected to Empower. The tenant does nothing.",
   o:["Worst case: supply cut, restored at the tenant's cost — AED 2,000 plus arrears","Cooling simply continues centrally via the service charges until the tenant registers","Managd registers the account in the tenant's name on their behalf","Supply cut and restored at the owner's cost, then recharged to the tenant"],
   c:0,w:"We give the tenant notice of the registration obligation. Enforcement and the reconnection cost sit with the provider and the tenant."}}
 ]
},
{
 id:"m7", nav:"8 · Living in the unit", num:"Module 8", title:"Maintenance, emergencies, and what is not ours",
 lede:"The day-to-day. There are two separate AED thresholds here, and mixing them up is the single most common numeric error new coordinators make.",
 blocks:[
  {t:"h",v:"Two different thresholds — do not merge them"},
  {t:"p",v:"AED 500 answers “who pays for this repair?”. AED 1,000 answers “can Managd commission this repair without asking the owner first?”. They are independent of each other."},
  {t:"table",v:{head:["Threshold","Question it answers","Rule"],rows:[
    ["AED 500","Who pays for the repair?","While the unit is rented: repairs up to AED 500 are borne by the tenant, per the tenancy contract. Repairs above AED 500 are borne by the owner. While the unit is vacant, the owner bears repairs of any amount — there is no tenant to charge."],
    ["AED 1,000","Can Managd commission the work without prior owner approval?","A cost estimate is always prepared. Up to AED 1,000, Managd can commission the work independently, informing the owner. Above AED 1,000, explicit owner approval is obtained in advance."]
  ]}},
  {t:"callout",v:"<b>Worked example.</b> A tap needs replacing, quoted at AED 350, tenant in place. You can commission it without asking the owner (it is under the AED 1,000 approval line) — and the invoice goes to the tenant (it is under the AED 500 cost line), per the tenancy contract. A AED 800 repair in the same rented unit: still no owner approval needed, but now the owner pays, because it crossed AED 500."},
  {t:"h",v:"Other costs worth knowing at a glance"},
  {t:"table",v:{head:["Cost item","While vacant","While rented"],rows:[
    ["Utility base fees (DEWA, Empower)","Owner","Tenant — registered in their own name"],
    ["Consumption (electricity, water, cooling)","Owner (usually minor)","Tenant"],
    ["Deep cleaning before move-in (one-off)","—","Owner — once before move-in, AED 0.6/sqft plus VAT"],
    ["Defects within the Defect Liability Period","Developer","Developer"]
  ]}},
  {t:"h",v:"How a repair actually runs — step by step"},
  {t:"flow",v:[["1","Tenant reports the issue in writing"],["2","Managd obtains a cost estimate"],["3","Up to AED 1,000: Managd commissions and informs the owner · above AED 1,000: owner approves first"],["4","Work done by Managd's approved contractors"],["5","Invoice: up to AED 500 → tenant · above AED 500 → owner"]]},
  {t:"list",v:[
    "<b>First check: is the unit still in the Defect Liability Period?</b> The DLP is usually the first year after handover. During it, the developer remedies defects not caused by the user — whether the unit is rented or vacant. Report these to the developer; they are not a tenant or owner cost.",
    "<b>Reporting.</b> The tenant submits maintenance requests to Managd in writing. Water leaks, water damage and structural issues must be reported immediately — if a late report makes the damage worse, the additional damage is the tenant's liability.",
    "<b>Cost estimate — always.</b> Managd obtains an estimate for every repair and informs the owner of every maintenance measure, even the small ones.",
    "<b>Approval.</b> Up to AED 1,000 Managd may commission the work under the management agreement without separate consent. Above AED 1,000 the owner's explicit approval is obtained before commissioning.",
    "<b>Contractors.</b> Managd coordinates the work through its panel of approved contractors. The tenant may not bring in their own contractor for work above AED 500 without Managd's prior written approval.",
    "<b>Who pays, while rented.</b> Up to AED 500 per occurrence: the tenant. Above AED 500: the owner, who is responsible for major structural and systemic maintenance — electrical, mechanical, plumbing and air-conditioning systems. Damage caused by misuse, negligence or a tenant breach is the tenant's cost regardless of the amount. The tenant keeps the unit in good condition, normal wear and tear excepted.",
    "<b>Who pays, while vacant.</b> The owner, for any amount."
  ]},
  {t:"h",v:"Two deposits — do not confuse them"},
  {t:"p",v:"Tenants only ever deal with the first one. The second is an owner arrangement you need to know about, because it is what makes fast repairs possible."},
  {t:"table",v:{head:["","Security deposit","Maintenance deposit"],rows:[
    ["Who pays it","The tenant","The owner"],
    ["Amount","5% of the annual rent (+5% with an approved pet)","AED 2,000, one-off"],
    ["When","At signing, before keys","After the first year of letting or once the Defect Liability Period has lapsed (the Handover Guide: from the second year onwards)"],
    ["Purpose","Security for the owner against damage, unpaid rent and tenant obligations","Money on hand so Managd can commission repairs immediately, especially in emergencies such as water damage, without waiting for the owner to send funds"],
    ["If used","Deductions only at move-out — for damage beyond normal wear and tear and other outstanding amounts","Topped up again to AED 2,000 by the owner"],
    ["Returned","Within 45 days of full move-out clearance, less deductions","At the end of the management agreement"]
  ]}},
  {t:"callout",v:"<b>The maintenance deposit does not change the rules.</b> Cost estimate, owner information, and owner approval above AED 1,000 all still apply — the deposit only removes the waiting time for money. And it never shifts a cost from the tenant to the owner: a AED 300 repair in a rented unit is still the tenant's."},
  {t:"p",v:"Liability: the manager is liable for gross negligence and deliberate breaches of duty — not for market fluctuations or tenant defaults."},
  {t:"h",v:"What is not our responsibility"},
  {t:"list",v:[
    "Common areas, pool and outdoor facilities — the building management company. We forward defects as a courtesy, without obligation and without follow-up.",
    "Maintenance of the air conditioning inside the unit — the owner's responsibility; Managd coordinates on request.",
    "The amount and use of service charges — the owners association and the building management company."
  ]},
  {t:"h",v:"Vacancy and emergencies"},
  {t:"p",v:"Vacant units are walked through weekly; during longer vacancy the water pressure is also reduced to prevent damage such as leaks. For emergencies Managd provides fast coordination and is the direct on-site contact for tenants. For electricity and water emergencies, DEWA's emergency number is 991."},
  {t:"scenario",v:{from:"Tenant, 9pm",msg:"Water is coming through the ceiling in the bedroom. It's getting worse.",
   o:["Emergency: coordinate now (DEWA 991 if safety is at risk), document it, get a cost estimate for the repair","Get the cost estimate first and, if it is above AED 1,000, the owner's approval before sending anyone to the unit","Ask the tenant to call a plumber of their choice and send us the invoice","Log it for the next working day — nothing can be commissioned out of hours"],
   c:0,w:"Fast coordination in emergencies is exactly what Managd is contracted for. The cost estimate and approval logic still apply to the repair itself — but they do not delay stopping the damage."}},
  {t:"quiz",v:{q:"A quote comes in at AED 1,600 for a repair in an occupied unit.",
   o:["Owner approves the estimate first, then commission; the owner pays","Commission it straight away — it is above AED 500, so it is the owner's cost anyway","Get the owner's approval — then the tenant pays the first AED 500 and the owner the rest","Commission it and inform the owner afterwards, since the maintenance deposit covers it"],
   c:0,w:"Above AED 1,000, the owner approves before you commission. Above AED 500, the owner pays regardless of who approved it. Both thresholds point the same way here, but they are still two separate questions."}},
  {t:"quiz",v:{q:"A tenant asks who services the AC inside the apartment.",
   o:["The owner is responsible; Managd coordinates it on request","The building management, as part of the service charges","The tenant, since routine servicing costs less than AED 500","The developer, while the unit is within the Defect Liability Period"],
   c:0,w:"Explicitly carved out as the owner's responsibility, with coordination by Managd on request."}},
  {t:"quiz",v:{q:"A tenant asks: “Do I also need to pay the AED 2,000 maintenance deposit I heard about?”",
   o:["No — the AED 2,000 is the owner's deposit; the tenant pays only the 5% security deposit","Yes — tenants pay it from the second year of the tenancy, on top of the security deposit","Only if the tenant keeps a pet","No — it is taken out of the tenant's security deposit instead"],
   c:0,w:"Two different deposits from two different people. The tenant's is the 5% security deposit."}},
  {t:"quiz",v:{q:"A tenant is billed AED 420 for a repair. They push back: “Isn't this covered by the AED 1,000 you people always mention?”",
   o:["No — AED 1,000 is about owner approval; who pays follows the AED 500 line, so it's the tenant's","Yes — in an occupied unit, repairs up to AED 1,000 are covered by the owner without separate approval","No — in an occupied unit the tenant pays for every repair, whatever the amount","No, but it is covered by the owner's AED 2,000 maintenance deposit"],
   c:0,w:"This is exactly the confusion the two thresholds create for tenants too. Explain the two questions separately, plainly, and point to the tenancy contract for the AED 500 line."}}
 ]
},
{
 id:"m8", nav:"9 · Money", num:"Module 9", title:"Rent, deposit, service charges",
 lede:"Three different pots of money that tenants routinely confuse with each other.",
 blocks:[
  {t:"h",v:"Rent"},
  {t:"p",v:"Cheques are issued to DGMA Legal, the only party authorised to receive funds. Managd administers the cheques operationally and handles default management for bounced cheques. The owner is paid 10 to 14 days after clearing; under Premium the service charges are paid out of the rental income first."},
  {t:"p",v:"The annual rent is customarily paid by postdated cheques — usually in one to four instalments, in individual cases up to six. Monthly payment is possible only in individual cases, and one condition is mandatory: the owner must hold a bank account in the UAE."},
  {t:"h",v:"Deposit"},
  {t:"p",v:"The security deposit is 5% of the annual rent, plus 5% with an approved pet; it is settled only at move-out, against the photo handover protocol, and the remaining balance is returned to the tenant."},
  {t:"p",v:"The deposit is not a payment channel during the tenancy. Deductions are made exclusively at move-out — for damage beyond normal wear and tear and other outstanding amounts. Repairs, fines and fees during the tenancy are paid separately."},
  {t:"h",v:"Paying a cheque instalment by bank transfer instead"},
  {t:"p",v:"A tenant may settle a rent instalment by bank transfer, but the money must be credited to the designated account at least 5 calendar days before the due date of the corresponding postdated cheque, and the tenant must send Managd proof of the transfer so the cheque is not presented."},
  {t:"h",v:"Service charges — the owner's cost, not the tenant's"},
  {t:"p",v:"Service charges are every owner's annual contribution to the running costs of the building: maintenance and cleaning of common areas, pool, gym and outdoor facilities, security, lifts, building insurance, building management, and a reserve fund for major repairs. While the building is not connected to Empower, central cooling runs through them too."},
  {t:"p",v:"They are calculated per square foot according to the allocation key registered with the Dubai Land Department; the rate differs from building to building and is set anew every year. The budget is decided by the owners association and the building management company it appoints, and is reviewed and approved by RERA before it may be billed through Mollak — the Dubai Land Department platform on which every building, unit and owner is registered. Billing runs on quarterly prepayment with automated reminders."},
  {t:"callout",v:"<b>Service charges are not a Managd or DGMA fee.</b> They apply to every property in Dubai, whether it is rented out, owner-occupied or vacant. Managd, DGMA and DG Homes are not part of the owners association and have no voting rights there."},
  {t:"quiz",v:{q:"An owner asks us to negotiate the service charge rate down.",
   o:["The OA and its building management set it, RERA approves, Mollak bills — we have no influence or vote","Offer to raise it at the next owners association meeting on the owner's behalf, as their managing agent","Escalate it to Managd management, who negotiate the rates with the developer each year","Explain that DGMA can object to the rate at RERA under the PoA"],
   c:0,w:"Be straight about the limit of our role. Owners generally accept it when the actual decision chain is named."}},
  {t:"quiz",v:{q:"A unit is vacant for six months. Service charges are:",
   o:["Payable in full — they apply regardless of occupancy","Payable, but at a reduced vacancy rate","Suspended until the next tenant moves in","Paid by Managd and recovered from the first rent"],
   c:0,w:"The charge follows the unit, not the tenancy."}},
  {t:"quiz",v:{q:"A tenant asks to have a damaged blind deducted from their deposit now, mid-tenancy.",
   o:["Decline — the deposit is settled only at move-out; use the maintenance route","Agree — it is under AED 500, so the tenant pays it anyway and this saves a step","Agree, as long as the tenant confirms it in writing","Deduct it now and settle the rest of the deposit at move-out"],
   c:0,w:"Mid-tenancy repairs run through the maintenance process with its cost estimate and thresholds. Deductions from the deposit happen only at move-out."}}
 ]
},
{
 id:"m9", nav:"10 · Renewal", num:"Module 10", title:"Renewal: how the 90-day system actually works",
 lede:"A core part of the job. There is a system behind this, a contract clause behind the system, and a penalty behind the contract clause. Know all three.",
 blocks:[
  {t:"p",v:"Before the 90-day window, the market and the RERA index are reviewed and the position is aligned with the owner. If the rent is already at or above market level, no tenant contact is made deliberately — without notice, the contract renews automatically on unchanged terms, provided the tenant stays; approaching the tenant without cause would only open a price discussion that currently tends towards a reduction. Any change to rent or terms must reach the tenant no later than 90 days before the contract ends. If the tenant asks for an adjustment or counter-offers, the owner is always consulted before any commitment, and an agreed minimum rent is never undercut without the owner's consent. Market monitoring runs with DG Homes, using the RERA index and rent levels."},
  {t:"callout",v:"<b>Silence here is a decision, not an oversight.</b> Opening a conversation with a tenant who would have renewed quietly at market rent invites a negotiation the owner did not need."},
  {t:"h",v:"What actually happens at the 90-day mark"},
  {t:"p",v:"This isn't just a manual habit — it's built into the system. If nobody has opened a renewal discussion with the tenant before the 90-day mark — i.e. the contract is not marked “under negotiation” — the system automatically renews the contract and sends the tenant a notification. This is the mechanical version of “deliberate silence”: if the market review and owner alignment happened earlier and the decision was to say nothing, the system carries that decision out on schedule without anyone needing to remember to trigger it."},
  {t:"h",v:"When the tenant comes to us early: “under negotiation”"},
  {t:"p",v:"If a tenant contacts us more than 90 days before expiry — for example asking for a lower rent — the contract can be marked in the system as <b>under negotiation</b>. While this status is on, the automatic renewal is stopped. This opens a window to discuss the situation with the owner and, where the circumstances justify it, agree a rent reduction."},
  {t:"callout",v:"<b>The “under negotiation” status cannot stay on for long</b> — as long as it is on, the contract will not renew automatically. Use it only when a real discussion is open, go to the owner straight away, and bring the matter to a result quickly. Never promise the tenant a reduction before the owner has agreed."},
  {t:"p",v:"The tenant must give 90 days' written notice before lease expiry if they intend to vacate. Rental increases must also be notified to the tenant at least 90 days before lease expiry, using the RERA rental increase calculator — so the 90-day window cuts both ways: it's the deadline for us to communicate an increase, and the deadline for the tenant to tell us they're leaving."},
  {t:"h",v:"If the tenant wants out early"},
  {t:"p",v:"If the tenant terminates the contract early, for any reason initiated by the tenant, a penalty of two months' rent applies. The owner then refunds any unused rent, calculated from the confirmed move-out date. This is a fixed contractual penalty, not something to negotiate away informally."},
  {t:"p",v:"<b>Late notice is the same case.</b> If no one opens a renewal discussion before the 90-day mark, the contract renews automatically. A tenant who only tells us later — say, one month before expiry — that they are not staying is therefore leaving a renewed contract early. The rule is the same: two months' rent penalty, and then the tenant is free to move out."},
  {t:"h",v:"What the Addendum adds to renewal"},
  {t:"list",v:[
    "An annual administrative fee of AED 1,150, including VAT, is payable by the tenant to Managd at every renewal.",
    "Renewal requires a valid Ejari registration. Failing to maintain one is a breach and may result in suspension of building access; the AED 500 Ejari penalty applies again at each renewal where Ejari is not maintained.",
    "If the contract has not been renewed and all renewal payments have not reached Managd at least 15 days before lease expiry, non-emergency maintenance requests — including administrative inquiries — are suspended.",
    "Continued refusal of lawful access after two written notices is also grounds for non-renewal."
  ]},
  {t:"flow",v:[["1","Review market and RERA index before the 90-day window"],["2","Align the position with the owner"],["3","If at or above market level: no tenant contact — the system auto-renews and notifies the tenant at 90 days"],["4","Tenant asks for a change more than 90 days ahead: mark the contract “under negotiation” (stops auto-renewal), consult the owner, resolve quickly"],["5","Tenant wants to leave early (including notice later than 90 days): two-month penalty"]]},
  {t:"scenario",v:{from:"Tenant, 100 days before contract end",msg:"I'd like to stay another year. What's the new rent going to be?",
   o:["Check market and RERA index, align with the owner, then reply — at market level it renews unchanged","Confirm the rent stays the same — with more than 90 days to go, the current terms simply roll over","Quote the RERA index rent straight away, then inform the owner of what you quoted","Say the system will send the new rent automatically at the 90-day mark"],
   c:0,w:"Even when the tenant initiates, the order does not change: market and index, then owner, then tenant. Never quote a number the owner has not agreed."}},
  {t:"scenario",v:{from:"Tenant, four months before lease expiry",msg:"Similar flats in the building are now cheaper than mine. I'd like to stay, but only if the rent comes down.",
   o:["Mark it “under negotiation”, check the market, talk to the owner promptly, promise nothing","Mark it “under negotiation” and keep it open until the tenant sends a formal counter-offer","Offer a small reduction within the owner's agreed rent range, then inform the owner","Let the contract renew automatically, then discuss a reduction for next year"],
   c:0,w:"Contact more than 90 days before expiry is exactly when the “under negotiation” status is used. It stops the automatic renewal, so it must not sit open for long, and the decision on any reduction is the owner's."}},
  {t:"scenario",v:{from:"Tenant, 30 days before lease expiry",msg:"Sorry, I completely forgot to tell you — I'm not renewing. I'll move out when the lease ends next month.",
   o:["The contract has already renewed, so leaving is early termination: two months' rent, then free to go","The contract has renewed, so they must stay for the full new term or pay all the remaining rent","Notice is late by two months, so the penalty is one month's rent","No penalty — they are leaving at the end of the lease, not in the middle of it"],
   c:0,w:"It is the same rule as any early exit: two months' rent, and then the tenant is free to leave. Explain it plainly and move on to the move-out process — inspection booked 48 hours ahead, clearances, keys."}},
  {t:"scenario",v:{from:"Tenant, 5 months into a 12-month contract",msg:"My company is relocating me. I need to end the lease now — is that a problem?",
   o:["Two months' rent; unused rent is refunded from the confirmed move-out date","No penalty for employer relocations, as long as 90 days' written notice is given","Two months' rent penalty, and rent already paid is not refunded","Three months' rent penalty, as for any mid-term exit"],
   c:0,w:"90 days' notice is the exit mechanism for a lease that has run its course. Ending it early, for any tenant-initiated reason including relocation, triggers the two-month penalty instead — the two are not interchangeable."}},
  {t:"quiz",v:{q:"Nobody has contacted the tenant about renewal and the 90-day mark passes. What happens?",
   o:["It renews automatically on the same terms and the tenant is notified","It renews automatically, but only once the tenant confirms within 15 days","It ends on its expiry date unless the tenant asks to renew","It renews automatically at the current RERA index rent"],
   c:0,w:"This is the system enforcing the “deliberate silence” strategy — no action needed if the earlier review confirmed the rent was already at market level."}},
  {t:"quiz",v:{q:"The rent is at market level and the 90-day window is approaching. What do you do?",
   o:["Deliberately make no tenant contact — the contract renews automatically","Send a short courtesy reminder so the tenant is not surprised","Mark the contract “under negotiation”, just to be safe","Ask the tenant before the 90-day mark whether they plan to stay"],
   c:0,w:"Contact is what opens a renegotiation. If the position is already right, do not create one."}},
  {t:"quiz",v:{q:"A tenant counter-offers below the position you agreed with the owner.",
   o:["Consult the owner before any answer","Accept it if it is still within the RERA index range","Reject it — the position was already agreed with the owner","Accept it if the difference is under 5%"],
   c:0,w:"Owner consultation on tenant counter-offers is explicitly part of the renewal process."}},
  {t:"scenario",v:{from:"Tenant, 10 days before lease expiry, renewal fee not yet paid",msg:"The wardrobe door hinge is loose, can you send someone this week?",
   o:["Non-emergency requests are on hold until the renewal and its payments are done — help them finish it","Book it — the contractual suspension only starts in the last 7 days before expiry, so there is still time","Book it — it is under AED 500, so the tenant pays anyway","Book it and add the renewal fee to the same invoice"],
   c:0,w:"The suspension is contractual and only covers non-emergency requests. A water leak would still be handled immediately."}}
 ]
},
{
 id:"m10", nav:"11 · Default & move-out", num:"Module 11", title:"When payment stops, and when the tenancy ends",
 lede:"Two processes with a strict order. Skipping a step here creates legal problems, not just service problems.",
 blocks:[
  {t:"h",v:"Payment default"},
  {t:"table",v:{head:["Stage","Who","What happens"],rows:[
    ["Stage 1","Managd","Reminders and collection from the tenant"],
    ["Stage 2","DGMA Legal — Premium included, Basic on separate mandate","Written demand with a 5-day deadline; recommendation and support for RDC execution proceedings; expenses of approximately AED 400 borne by the owner"],
    ["Court proceedings","DGMA Legal, separate mandate only","First and second instance, plus court fees — never automatically included"]
  ]}},
  {t:"p",v:"Managd also handles default management for bounced cheques as part of rental income administration, and eviction measures in the case of rent default form part of the tenant management scope."},
  {t:"h",v:"How the Addendum shapes enforcement"},
  {t:"list",v:[
    "After a returned cheque, the tenant must provide an alternative payment for the full rental amount within 3 working days of the due date; failing that is a breach and leads to eviction proceedings.",
    "Before any RDC claim or presenting a Penalty Reserve Cheque, Managd issues a formal written demand stating the amount, the basis of the claim, and a cure period of at least 5 working days, unless the Addendum specifies a shorter one.",
    "Managd may file claims for amounts payable to it at the RDC in its own name, without the landlord as co-claimant. Court fees, legal expenses and execution costs are borne by the tenant.",
    "Formal notices go by email or WhatsApp to the contact details registered with Managd and are deemed received on the day of sending. Keeping those details current is the tenant's responsibility."
  ]},
  {t:"h",v:"Move-out"},
  {t:"list",v:[
    "The tenant gives 90 days' written notice to Managd before lease expiry — a later exit counts as early termination with the two-month rent penalty. During the final month Managd or the landlord may hold viewings with 48 hours' notice.",
    "The tenant schedules the move-out inspection with Managd at least 48 hours in advance. DEWA must remain active until the inspection is completed.",
    "At or before the inspection the tenant provides final clearance documents for DEWA, gas and chiller/Empower (if applicable), proof of Ejari cancellation, and returns all keys, access cards and parking fobs. Items not returned are charged at AED 350 plus VAT per item type, deductible from the deposit.",
    "A mandatory sanitisation fee, amount advised by Managd, is deducted from the deposit. Where internal balcony wall repairs or full professional repainting are needed, the tenant completes them before vacating; otherwise the landlord arranges them and deducts the cost.",
    "Pre-inspection with the tenant against the photo handover protocol.",
    "Recording and execution of the required works.",
    "Deposit settlement, with the remaining balance returned to the tenant.",
    "The tenant settles all outstanding utility amounts first on the final bill; only then can the DEWA and Empower accounts be closed.",
    "DGMA handles payout and settlement of the funds flows; DG Homes re-markets the unit.",
    "The deposit is refunded within 45 calendar days from the later of the move-out date and the date all move-out clearances were received and verified by Managd.",
    "If repair or reinstatement costs exceed the deposit, the tenant pays the balance within 5 working days of written demand; from day six a late penalty of AED 100 per day accrues until paid.",
    "If a tenant abandons the unit for more than 60 consecutive days without written notice and without settling dues, the landlord may — in line with UAE law and any required legal procedure — access the unit, change locks and remove belongings; uncollected belongings may be disposed of after 15 days' written notice."
  ]},
  {t:"scenario",v:{from:"Tenant, two weeks before moving out",msg:"Just close my DEWA and Empower accounts for me and take whatever is owed from the deposit.",
   o:["They settle final bills and bring clearances; DEWA stays on until the inspection; deposit is separate","Agree — at move-out the final DEWA and Empower bills can be deducted from the deposit in one step","Agree to close both accounts for them right after the move-out inspection","Tell them to close DEWA now, before they hand back the keys"],
   c:0,w:"Two separate processes that tenants constantly merge. Utilities are settled with the providers, and the final clearance documents are brought to the move-out inspection — DEWA must stay active until that inspection is done. The deposit is settled separately against the move-in protocol."}},
  {t:"scenario",v:{from:"Tenant, this morning",msg:"I'm handing back the keys at 5pm today, can someone do the inspection then?",
   o:["Inspection needs 48 hours' notice — book the earliest slot; DEWA stays on","Take the keys at 5pm and carry out the inspection within the following 48 hours","Do it at 5pm if a colleague is free — the 48 hours is only a guideline","Ask them to leave the keys with security and inspect the next morning"],
   c:0,w:"The 48-hour scheduling rule is one of the points the tenant specifically acknowledges when signing the Addendum."}},
  {t:"quiz",v:{q:"A tenant has missed two months. The owner is on Basic and wants a formal demand letter sent.",
   o:["Stage 2 is DGMA Legal — included in Premium, a separate mandate under Basic","Managd sends it — a formal demand is part of Stage 1 reminders and collection","DGMA sends it — legal steps are included in both packages","The owner files at the RDC directly; no demand letter is needed"],
   c:0,w:"Stage 1 is ours: reminders and collection. Stage 2 is DGMA, and for a Basic owner it requires a separate mandate — say so before anything is promised."}}
 ]
},

{
 id:"m_addendum", nav:"12 · The signed contract", num:"Module 12", title:"What's actually in the Tenancy Contract Addendum",
 lede:"The factsheets describe how MANAGD generally works. This is the document you will actually open when a tenant disputes a charge — read it as the real rulebook, not background reading.",
 blocks:[
  {t:"p",v:"Every MANAGD tenancy runs on a short official Dubai Land Department contract plus a much longer Addendum that MANAGD attaches to it. The Addendum is where almost all of the operational detail actually lives — penalties, the payment order, pets, subletting, deposit timing. When you and a tenant disagree about a number, this is the document that settles it, not a factsheet."},
  {t:"h",v:"Two entities, two jobs — restated precisely"},
  {t:"p",v:"All rental cheques are payable to DGMA Legal Consultancy FZ-LLC, as PoA holder. Separately, Managd is entitled to collect, enforce and retain — in its own name — all management fees, administrative fees and penalty charges named in the Addendum as payable to Managd. The Addendum is explicit that these are legally distinct from the rent and deposit owed to the landlord. In practice: two different payees, and Managd can pursue its own fees at the RDC without needing the landlord as a co-claimant."},
  {t:"h",v:"The Payment Waterfall — the single most important mechanic in this module"},
  {t:"p",v:"Whatever a tenant pays — by cheque or bank transfer — it is applied in a fixed order, regardless of what the tenant intended it for:"},
  {t:"table",v:{head:["Order","Applied to"],rows:[
    ["1st","Outstanding fines and violation penalties payable to Managd"],
